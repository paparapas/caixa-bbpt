function settleRow(C, pid, tid) {
  const acts = actionsFor(C, pid);
  return `<li class="settle-row ${acts[0].cls}${pid === meId() ? ' me' : ''}"><div class="settle-who"><b>${esc(pn(pid))}</b>${pid === meId() ? chip('tu', 'ok') : ''}${pid === S.settings.treasurerId ? chip('tesoureiro', 'soft') : ''}</div>
    <div class="settle-acts">${acts.map((a) => `<div class="settle-act"><span>${esc(a.txt)}</span>${a.kind ? `<button type="button" class="btn small" data-act="quick" data-kind="${a.kind}" data-pid="${pid}" data-amt="${a.amount}" data-acc="${a.accountId || ''}" data-store="${a.storeId || ''}" data-tid="${tid || ''}">Registar</button>` : ''}</div>`).join('')}</div></li>`;
}

/* ---------- Torneios ---------- */
function tourStatus(t) {
  if (t.example) return chip('exemplo', 'soft');
  const changed = alertsFor(t.id).some((a) => a.txt.startsWith('Este torneio mudou'));
  if (changed) return chip('alterado depois de lançado', 'bad');
  if (linked() && t.launched?.by === 'sheet' && sheetPayload(t.id).summary.length) return chip('por escrever no Sheets', 'warn');
  return t.launched ? chip(t.launched.by === 'sheet' ? 'escrito no Sheets' : 'lançado no Excel', 'ok') : chip(linked() ? 'por escrever no Sheets' : 'por lançar', 'warn');
}

function vTours() {
  const ts = S.tournaments.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return `
  <header class="top"><div><p class="eyebrow">${meName() ? `Olá, ${esc(meName())}` : 'Check-in e contas'}</p><h1>Torneios</h1></div><div class="top-side">${syncChip()}<button type="button" class="btn primary editonly" data-act="new-tour">Novo torneio</button></div></header>
  ${readOnly() ? '<p class="banner">Estás em modo de leitura: vês tudo o que os organizadores registam, mas não podes alterar.</p>' : ''}
  ${ts.length ? `<ul class="cards">${ts.map((t) => {
    const C = compute(t.id);
    const open = Object.keys(C.P).some((pid) => Math.abs(C.P[pid].held) >= EPS && pid !== S.settings.treasurerId);
    return `<li><button type="button" class="evcard" data-act="open-tour" data-id="${t.id}">
      <span class="ev-date">${fmtDate(t.date)} · ${esc(typeById(t.typeId)?.name || '')}</span>
      <span class="ev-name">${esc(t.name)}</span>
      <span class="ev-meta">${C.players} jogadores · ${eur(C.total)} recebidos${C.debtN ? ` · ${C.debtN} em dívida` : ''}</span>
      <span class="ev-state">${tourStatus(t)}${open ? chip('dinheiro por entregar', 'warn') : ''}</span>
    </button></li>`;
  }).join('')}</ul>` : `<div class="empty"><p>Ainda não há torneios. Cria o primeiro e começa o check-in.</p></div>`}`;
}

function vTour() {
  const t = tourById(UI.tid);
  if (!t) { UI.tid = null; return vTours(); }
  const C = compute(t.id);
  const tabs = [['checkin', 'Check-in'], ['pagamentos', 'Pagamentos'], ['acertos', 'Acertos'], ['excel', 'Excel'], ['relatorio', 'Relatório']];
  const body = { checkin: vCheckin, pagamentos: vPayments, acertos: vSettle, excel: vExcel, relatorio: vReport }[UI.tTab] || vCheckin;
  return `
  <header class="top ev-top">
    <div class="ev-nav"><button type="button" class="link back" data-act="back">‹ Torneios</button>${syncChip()}</div>
    <div class="ev-title"><p class="eyebrow">${fmtDate(t.date)} · ${esc(typeById(t.typeId)?.name || 'Torneio')} · organiza ${esc(pn(t.organizerId))}</p><h1>${esc(t.name)}</h1></div>
    <div class="ev-tools">${tourStatus(t)}${t.sheetWeek && sheetComp(t.sheetTab) ? chip(`${t.sheetTab} · ${t.sheetWeek.replace(/^./, (c) => c.toUpperCase())}`, 'soft') : ''}<button type="button" class="btn small ghost editonly" data-act="edit-tour" data-id="${t.id}">Editar</button></div>
  </header>
  ${t.example ? `<p class="banner">${esc(t.notes)}</p>` : ''}
  ${(() => { const w = linked() && whoChanged([t.id, ...S.entries.filter((e) => e.tid === t.id).map((e) => e.id), ...S.moves.filter((m) => m.tid === t.id).map((m) => m.id)]); return w ? `<p class="muted small">Última alteração: <b>${esc(w.by || '?')}</b> · ${fmtWhen(w.at)}${t.launched?.who ? ` · escrito no Sheets por ${esc(t.launched.who)} em ${fmtDate(t.launched.date)}` : ''}</p>` : ''; })()}
  <section class="stats">
    <div><span>Jogadores</span><b>${C.players}</b></div>
    <div><span>MBWAY</span><b>${eur(C.byMethod.mbway || 0)}</b></div>
    <div><span>Numerário</span><b>${eur(C.byMethod.num || 0)}</b></div>
    ${C.byMethod.own ? `<div><span>Próprio</span><b>${eur(C.byMethod.own)}</b></div>` : ''}
    ${C.debtV ? `<div class="debt"><span>Em dívida</span><b>${eur(C.debtV)}</b></div>` : ''}
    <div><span>Total</span><b>${eur(C.total)}</b></div>
  </section>
  <p class="compline">${Object.entries(C.byComp).filter(([, v]) => v).map(([k, v]) => `<span>${esc(k)} <b>${eur(v)}</b></span>`).join('') || '<span class="muted">Ainda sem valores.</span>'}</p>
  <nav class="seg" aria-label="Secções do torneio">${tabs.map(([k, l]) => `<button data-act="t-tab" data-tab="${k}" aria-pressed="${UI.tTab === k}">${l}</button>`).join('')}</nav>
  ${body(t, C)}`;
}

/* --- Check-in --- */
function ciResults(t) {
  const inIds = new Set(S.entries.filter((e) => e.tid === t.id).map((e) => e.playerId));
  const q = UI.q.trim().toLowerCase();
  if (!q) return '';
  const hits = S.players.filter((p) => !inIds.has(p.id) && p.name.toLowerCase().includes(q)).slice(0, 8);
  const exact = S.players.some((p) => p.name.toLowerCase() === q);
  const already = S.players.filter((p) => inIds.has(p.id) && p.name.toLowerCase().includes(q));
  return `<ul class="results">${hits.map((p) => `<li><button type="button" class="result" data-act="ci-add" data-id="${p.id}">${esc(p.name)}${p.org ? ' ' + chip('organizador', 'soft') : ''}</button></li>`).join('')}
    ${exact ? '' : `<li><button type="button" class="result new" data-act="ci-new">+ Novo jogador «${esc(UI.q.trim())}»</button></li>`}</ul>
    ${already.length ? `<p class="hint">Já no check-in: ${already.map((p) => esc(p.name)).join(', ')}</p>` : ''}`;
}

function vCheckin(t) {
  const entries = S.entries.filter((e) => e.tid === t.id);
  const nm = S.settings.newMethod || 'mbway';
  return `
  <section class="addbox">
    <label class="field" for="ciSearch">Adicionar jogador</label>
    <input id="ciSearch" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escreve o nome…" value="${esc(UI.q)}">
    <div class="newmethod"><span class="muted small">Entra como</span>
      <div class="mini-seg">${['mbway', 'num', 'debt'].map((k) => `<button type="button" data-act="new-method" data-m="${k}" aria-pressed="${nm === k}">${METHOD[k]}</button>`).join('')}</div>
    </div>
    <div id="ciResults">${ciResults(t)}</div>
  </section>
  ${entries.length ? `<ul class="ci-list">${entries.slice().reverse().map((e) => ciRow(t, e)).join('')}</ul>` : '<div class="empty"><p>Ninguém no check-in. Procura o primeiro jogador acima.</p><p>Cada jogador entra com a loja e a liga marcadas. A mensal de estádios só vem marcada se ainda não pagou este mês.</p></div>'}`;
}

function ciRow(t, e) {
  const pl = playerById(e.playerId);
  const month = monthKey(t.date);
  const comps = t.comps.map((c) => {
    const on = e.amt[c.key] != null;
    let label = `${c.label} ${eurPlain(on ? e.amt[c.key] : c.price).replace(',00', '')}€`;
    let cls = '';
    if (c.monthly && !t.example) {
      const pe = monthlyPaidElsewhere(e.playerId, month, e.id);
      if (pe && !on) { label = `Mensal ✓ ${monthName(month).slice(0, 3)}`; cls = 'paid'; }
      if (pe && on) cls = 'dup';
    }
    return `<button type="button" class="tog ${cls}" data-act="tog" data-id="${e.id}" data-key="${c.key}" aria-pressed="${on}">${esc(label)}</button>`;
  }).join('');
  const methods = ['mbway', 'num'].concat(pl?.org ? ['own'] : []).concat(['debt']);
  const other = e.method !== 'own' && e.recv !== t.organizerId;
  return `<li class="ci ${e.method === 'debt' ? 'is-debt' : ''}">
    <div class="ci-head"><span class="ci-name">${esc(pn(e.playerId))}</span>${other ? chip('pagou a ' + pn(e.recv), 'warn') : ''}<span class="ci-total">${eur(entryTotal(e))}</span><button type="button" class="icon-btn sm" data-act="ci-more" data-id="${e.id}" aria-label="Mais opções de ${esc(pn(e.playerId))}">⋯</button></div>
    <div class="ci-comps">${comps}</div>
    <div class="mini-seg ci-pay" role="group" aria-label="Como pagou">${methods.map((k) => `<button type="button" data-act="set-method" data-id="${e.id}" data-m="${k}" aria-pressed="${e.method === k}" class="m-${k}">${METHOD[k]}</button>`).join('')}</div>
  </li>`;
}

function addEntry(t, playerId) {
  const m = S.settings.newMethod || 'mbway';
  S.entries.push({ id: uid('n'), tid: t.id, playerId, amt: defaultAmounts(t, playerId), method: m, recv: t.organizerId || S.settings.treasurerId });
  UI.q = '';
  save(); render(); focusSearch();
}
function focusSearch() { const i = $('#ciSearch'); if (i) { i.focus(); } }

function entrySheet(e) {
  const t = tourById(e.tid);
  openSheet({
    title: pn(e.playerId),
    del: () => { S.entries = S.entries.filter((x) => x.id !== e.id); },
    delLabel: 'Tirar do check-in',
    body: `
      <fieldset class="comps"><legend>Valores</legend>
        ${t.comps.map((c) => `<div class="comp-row"><label class="check"><input type="checkbox" name="on_${c.key}" ${e.amt[c.key] != null ? 'checked' : ''}> <span>${esc(c.label)}</span></label><input name="v_${c.key}" inputmode="decimal" value="${esc(eurPlain(e.amt[c.key] ?? c.price))}" aria-label="Valor de ${esc(c.label)}"></div>`).join('')}
      </fieldset>
      <label class="field">Pagou por<select name="method">${Object.entries(METHOD).filter(([k]) => k !== 'own' || playerById(e.playerId)?.org).map(([k, v]) => opt(k, v, k === e.method)).join('')}</select></label>
      <label class="field">Dinheiro ficou com<select name="recv">${orgOpts(e.recv)}</select></label>
      <p class="hint">Se o jogador pagou por engano a outro organizador, escolhe aqui quem recebeu. A app trata do resto nos acertos.</p>
      ${linked() && LINK.meta?.[e.id] ? `<p class="muted small">Registado/alterado por <b>${esc(LINK.meta[e.id].by || '?')}</b> · ${fmtWhen(LINK.meta[e.id].at)}</p>` : ''}
      <p class="total">Total <b id="entryTotal">—</b></p>`,
    onMount: (form) => {
      const upd = () => { const fd = new FormData(form); $('#entryTotal').textContent = eur(t.comps.reduce((s, c) => s + (fd.get('on_' + c.key) ? num(fd.get('v_' + c.key)) : 0), 0)); };
      form.addEventListener('input', upd); form.addEventListener('change', upd); upd();
    },
    onSubmit: (fd) => {
      const amt = {};
      t.comps.forEach((c) => { if (fd.get('on_' + c.key)) amt[c.key] = r2(num(fd.get('v_' + c.key))); });
      const method = fd.get('method');
      e.amt = amt; e.method = method;
      e.recv = method === 'own' ? e.playerId : fd.get('recv');
      return null;
    },
  });
}

/* --- Pagamentos --- */
function vPayments(t, C) {
  const stores = Object.entries(C.store);
  const cash = Object.values(C.P).filter((p) => p.cashIn || p.cashOut);
  return `
  <section class="block"><h2>Loja</h2>
    ${stores.length ? stores.map(([id, s]) => { const out = r2(s.due - s.paid); return `<article class="storecard">
      <div class="sc-head"><h3>${esc(storeById(id)?.name)}</h3>${Math.abs(out) < EPS ? chip('pago', 'ok') : chip(out > 0 ? `faltam ${eur(out)}` : 'pago a mais', out > 0 ? 'warn' : 'bad')}</div>
      <dl class="sc-meta"><div><dt>A pagar</dt><dd>${eur(s.due)}</dd></div><div><dt>Pago</dt><dd>${eur(s.paid)}</dd></div>${s.debt ? `<div><dt>De jogadores em dívida</dt><dd>${eur(s.debt)}</dd></div>` : ''}</dl>
      ${out > EPS ? `<button type="button" class="btn primary" data-act="new-move" data-kind="loja" data-store="${id}">Registar pagamento à loja</button>` : ''}
    </article>`; }).join('') : '<p class="muted">Sem valores de loja no check-in.</p>'}
  </section>
  ${cash.length ? `<section class="block"><h2>Numerário</h2><ul class="kv">${cash.map((p) => `<li><span>${esc(pn(p.id))}</span><span>recebeu ${eur(p.cashIn)} · usou ${eur(p.cashOut)} · ${p.cashLeft >= 0 ? `tem ${eur(p.cashLeft)}` : `<b class="neg">falta ${eur(-p.cashLeft)}</b>`}</span></li>`).join('')}</ul></section>` : ''}
  <section class="block"><h2>Outros movimentos</h2>
    <div class="bar wrap">${['envio', 'deposito', 'despesa', 'receita', 'reembolso'].map((k) => `<button type="button" class="btn" data-act="new-move" data-kind="${k}">${MOVE_LABEL[k]}</button>`).join('')}</div>
    <p class="hint">Envio: um organizador passou dinheiro a outro. Depósito: dinheiro entrou numa conta da org. Despesa: algo pago durante o evento (vai para a tabela Despesas do Excel). Receita extra: doação ou outro valor que não é inscrição.</p>
    ${moveRows(S.moves.filter((m) => m.tid === t.id))}
  </section>`;
}

function moveSummary(m) {
  if (m.kind === 'loja') return `${pn(m.by)} → ${storeById(m.storeId)?.name}` + (num(m.cash) ? ` · ${eur(m.cash)} numerário` : '') + (num(m.own) ? ` · ${eur(m.own)} do bolso` : '');
  if (m.kind === 'envio') return `${pn(m.from)} → ${pn(m.to)} · ${m.method}`;
  if (m.kind === 'deposito') return `${pn(m.by)} → ${accById(m.accountId)?.name}`;
  if (m.kind === 'despesa') return `${pn(m.by)} · ${catById(m.catId)?.name || ''}` + (num(m.own) ? ` · ${eur(m.own)} do bolso` : '');
  if (m.kind === 'receita') return `${lineById(m.lineId)?.name || ''} · com ${pn(m.recv)}`;
  return `${accById(m.accountId)?.name} → ${pn(m.to)}`;
}
function moveRows(list) {
  if (!list.length) return '<p class="muted">Sem movimentos.</p>';
  return `<ul class="rows">${list.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map((m) => `<li><button type="button" class="row" data-act="edit-move" data-id="${m.id}">
    <span class="row-main"><span class="row-kicker">${MOVE_LABEL[m.kind]} · ${fmtDate(m.date)}</span><b>${esc(m.desc || moveSummary(m))}</b><span class="muted">${esc(moveSummary(m))}</span></span>
    <span class="row-side">${money(r2(m.amount))}${!m.tid && (m.kind === 'receita' || m.kind === 'despesa') ? (m.launched ? chip('lançado', 'ok') : chip('por lançar', 'warn')) : ''}</span>
  </button></li>`).join('')}</ul>`;
}

function moveForm(kind, move, preset = {}) {
  const t = tourById(move ? move.tid : ('tid' in preset ? preset.tid : UI.tid));
  const C = t ? compute(t.id) : compute('all');
  const org = (playerById(meId())?.org && meId()) || t?.organizerId || S.settings.treasurerId;
  const m = move || {
    kind, tid: t?.id || null, date: todayISO(), desc: '', note: '', method: 'MBWAY',
    amount: preset.amount ?? '', by: preset.by || org, from: preset.from || org, to: preset.to || S.settings.treasurerId,
    recv: org, storeId: preset.storeId || '', accountId: preset.accountId || S.accounts[0]?.id, catId: S.cats.find((c) => c.fundId === 'f_est')?.id || S.cats[0]?.id, lineId: 'l_doa', cash: 0, own: 0,
  };
  kind = m.kind;
  if (kind === 'loja' && !move) {
    const s = C.store[m.storeId] || Object.values(C.store)[0];
    if (!m.storeId) m.storeId = Object.keys(C.store)[0] || S.stores[0]?.id;
    const due = r2((C.store[m.storeId]?.due || 0) - (C.store[m.storeId]?.paid || 0));
    m.amount = preset.amount ?? due;
    const cashAv = Math.max(0, C.P[m.by]?.cashLeft || 0);
    m.cash = r2(Math.min(cashAv, m.amount || 0));
    m.own = 0;
    void s;
  }
  const amountF = (lbl = 'Valor') => `<label class="field">${lbl}<input name="amount" inputmode="decimal" value="${m.amount !== '' ? esc(eurPlain(m.amount)) : ''}" placeholder="0,00"></label>`;
  const methodF = (list = MOVE_METHODS) => `<label class="field">Método<select name="method">${list.map((x) => opt(x, x, x === m.method)).join('')}</select></label>`;
  let fields = '';
  if (kind === 'loja') {
    fields = `
      <div class="row2"><label class="field">Quem pagou<select name="by">${orgOpts(m.by)}</select></label>
      <label class="field">Loja<select name="storeId">${S.stores.map((s) => opt(s.id, s.name, s.id === m.storeId)).join('')}</select></label></div>
      ${amountF('Valor pago à loja')}
      <p class="hint" id="cashHint"></p>
      <div class="row2"><label class="field">Do numerário recebido<input name="cash" inputmode="decimal" value="${esc(eurPlain(m.cash || 0))}"></label>
      <label class="field">Do próprio bolso<input name="own" inputmode="decimal" value="${esc(eurPlain(m.own || 0))}"></label></div>
      <p class="total small">MBWAY / transferência do dinheiro recebido <b id="restV">—</b></p>
      <p class="hint">O que puseste do próprio bolso é descontado sozinho no que tens de entregar. Não precisas de fazer contas à parte.</p>`;
  } else if (kind === 'envio') {
    fields = `<div class="row2"><label class="field">De<select name="from">${orgOpts(m.from)}</select></label><label class="field">Para<select name="to">${orgOpts(m.to)}</select></label></div>${amountF()}${methodF()}`;
  } else if (kind === 'deposito') {
    fields = `<div class="row2"><label class="field">Quem depositou<select name="by">${orgOpts(m.by)}</select></label><label class="field">Conta<select name="accountId">${accOpts(m.accountId)}</select></label></div>${amountF()}${methodF(['Transferência', 'MBWAY', 'Numerário'])}`;
  } else if (kind === 'despesa') {
    fields = `<label class="field">Descrição (como fica no Excel)<input name="desc" value="${esc(m.desc)}" placeholder="ex.: Pagamento danos Loja Fénix"></label>
      <div class="row2"><label class="field">Categoria<select name="catId">${catOpts(m.catId)}</select></label><label class="field">Quem pagou<select name="by">${orgOpts(m.by, true)}</select></label></div>
      ${amountF()}
      <div class="row2" id="ownRow"><label class="field">Do numerário recebido<input name="cash" inputmode="decimal" value="${esc(eurPlain(m.cash || 0))}"></label><label class="field">Do próprio bolso<input name="own" inputmode="decimal" value="${esc(eurPlain(m.own || 0))}"></label></div>
      <label class="field">Nota (Excel)<input name="note" value="${esc(m.note || '')}" placeholder="ex.: Incluindo shipping"></label>`;
  } else if (kind === 'receita') {
    fields = `<label class="field">Descrição<input name="desc" value="${esc(m.desc)}" placeholder="ex.: Doação"></label>
      <label class="field">Linha do Excel<select name="lineId">${lineOpts(m.lineId)}</select></label>
      <div class="row2"><label class="field">Ficou com<select name="recv">${orgOpts(m.recv, true)}</select></label>${methodF()}</div>${amountF()}`;
  } else {
    fields = `<div class="row2"><label class="field">Da conta<select name="accountId">${accOpts(m.accountId)}</select></label><label class="field">Para<select name="to">${orgOpts(m.to)}</select></label></div>${amountF()}<p class="hint">Usa quando a org devolve a alguém o que pôs do próprio bolso.</p>`;
  }
  const isGeneral = !m.tid && (kind === 'receita' || kind === 'despesa');
  openSheet({
    title: (move ? 'Editar · ' : '') + MOVE_LABEL[kind],
    del: move ? () => { S.moves = S.moves.filter((x) => x.id !== move.id); } : null,
    body: `${fields}
      <div class="row2"><label class="field">Data<input type="date" name="date" value="${esc(m.date)}"></label>
      <label class="field">Torneio<select name="tid">${tourOpts(m.tid)}</select></label></div>
      ${move && linked() && LINK.meta?.[move.id] ? `<p class="muted small">Registado/alterado por <b>${esc(LINK.meta[move.id].by || '?')}</b> · ${fmtWhen(LINK.meta[move.id].at)}</p>` : ''}
      ${kind !== 'despesa' && kind !== 'receita' ? `<label class="field">Notas<input name="desc" value="${esc(m.desc)}" placeholder="opcional"></label>` : ''}
      ${isGeneral && move && linked() ? sheetBox(null, move.id) : ''}
      ${isGeneral && move && !linked() ? `<div class="bar wrap">${move.launched ? `<span class="muted small">Lançado no Excel em ${fmtDate(move.launched.date)}</span><button type="button" class="btn small ghost" data-act="unlaunch-move" data-id="${move.id}">Desmarcar</button>` : `<button type="button" class="btn small" data-act="launch-move" data-id="${move.id}">Marcar como lançado no Excel</button>`}</div>${excelBlock(excelPlan(null, move.id))}` : ''}`,
    onMount: (form) => {
      const upd = () => {
        const fd = new FormData(form);
        if (kind === 'loja') {
          const p = C.P[fd.get('by')];
          $('#cashHint').textContent = `Numerário da org com ${pn(fd.get('by'))}: ${eur(Math.max(0, (p?.cashLeft || 0) + (move && move.by === fd.get('by') ? num(move.cash) : 0)))}.`;
          $('#restV').textContent = eur(num(fd.get('amount')) - num(fd.get('cash')) - num(fd.get('own')));
        }
        if (kind === 'despesa') $('#ownRow').hidden = String(fd.get('by')).startsWith('acc:');
      };
      form.addEventListener('input', upd); form.addEventListener('change', upd); upd();
    },
    onSubmit: (fd) => {
      const amount = r2(num(fd.get('amount')));
      if (amount <= 0) return 'O valor tem de ser maior que zero.';
      const base = { kind, tid: fd.get('tid') || null, date: fd.get('date') || todayISO(), desc: String(fd.get('desc') || '').trim(), amount };
      let d;
      if (kind === 'loja') {
        const cash = r2(num(fd.get('cash'))), own = r2(num(fd.get('own')));
        if (cash < 0 || own < 0 || cash + own > amount + EPS) return 'Numerário + próprio bolso não pode ser mais do que o valor pago.';
        d = { ...base, by: fd.get('by'), storeId: fd.get('storeId'), cash, own };
      } else if (kind === 'envio') {
        if (fd.get('from') === fd.get('to')) return 'Quem envia e quem recebe têm de ser pessoas diferentes.';
        d = { ...base, from: fd.get('from'), to: fd.get('to'), method: fd.get('method') };
      } else if (kind === 'deposito') d = { ...base, by: fd.get('by'), accountId: fd.get('accountId'), method: fd.get('method') };
      else if (kind === 'despesa') {
        const byAcc = String(fd.get('by')).startsWith('acc:');
        const cash = byAcc ? 0 : r2(num(fd.get('cash'))), own = byAcc ? 0 : r2(num(fd.get('own')));
        if (cash + own > amount + EPS) return 'Numerário + próprio bolso não pode ser mais do que o valor.';
        if (!base.desc) return 'Escreve a descrição, tal como vai aparecer no Excel.';
        d = { ...base, by: fd.get('by'), catId: fd.get('catId'), note: String(fd.get('note') || '').trim(), cash, own };
      } else if (kind === 'receita') d = { ...base, recv: fd.get('recv'), lineId: fd.get('lineId'), method: fd.get('method') };
      else d = { ...base, accountId: fd.get('accountId'), to: fd.get('to') };
      if (move) { const keep = { id: move.id, launched: move.launched || null }; Object.keys(move).forEach((k) => delete move[k]); Object.assign(move, keep, d); }
      else S.moves.push({ id: uid('m'), ...d });
      return null;
    },
  });
}

  </section>
  ${others.length ? `<section class="block"><h2>Pagaram a outro organizador</h2><ul class="kv">${others.map(([pid, r]) => `<li><span>${esc(pn(pid))} recebeu de</span><span>${r.others.map((e) => `${esc(pn(e.playerId))} ${eur(entryTotal(e))}`).join(', ')}</span></li>`).join('')}</ul></section>` : ''}
  <section class="block"><h2>Conta de cada um</h2><div class="pgrid">${pids.map((pid) => {

      <tfoot><tr><td>${p.held >= 0 ? 'Tem da org' : 'A org deve-lhe'}</td><td>${eur(Math.abs(p.held))}</td></tr></tfoot></table>
      ${p.cashIn || p.cashOut ? `<p class="muted small">Numerário: recebeu ${eur(p.cashIn)}, usou ${eur(p.cashOut)}${p.own ? `, pôs ${eur(p.own)} do bolso` : ''}.</p>` : ''}
    </article>`;
  }).join('')}</div></section>
  <section class="block"><h2>Para onde vai o dinheiro</h2>
    <div class="tablewrap"><table class="data compact"><thead><tr><th>Destino</th><th>Devido</th><th>Chegou</th><th>Falta</th></tr></thead><tbody>
    ${Object.entries(C.store).map(([id, s]) => `<tr><td>${esc(storeById(id)?.name)}</td><td>${eur(s.due)}</td><td>${eur(s.paid)}</td><td>${Math.abs(s.due - s.paid) < EPS ? '✓' : eur(s.due - s.paid)}</td></tr>`).join('')}
    ${C.accs.filter((a) => a.excel || a.bank).map((a) => `<tr><td>${esc(accById(a.id)?.name)}</td><td>${eur(a.excel)}</td><td>${eur(a.bank)}</td><td>${Math.abs(a.pending) < EPS ? '✓' : eur(a.pending)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="verify ${C.balanced ? 'ok' : 'bad'}">${C.balanced ? '✓ As contas batem: o dinheiro com pessoas é igual ao que falta chegar à loja e às contas.' : '✗ As contas não batem. Revê os movimentos.'}</p>
  </section>`;
}

/* --- Excel --- */
function excelBlock(p) {
  const tsvIncome = p.lines.map((l) => [l.section, l.name, eurPlain(l.after)].join('\t')).join('\n');
  const tsvExp = p.exp.map((x) => [x.desc, x.date, x.cat, x.note, eurPlain(x.value)].join('\t')).join('\n');
  const changed = p.lines.some((l) => l.changed);
  return `
  <section class="block"><h2>Budget Geral · Income</h2>
    ${p.lines.length ? `<ul class="xlist">${p.lines.map((l) => `<li${l.changed ? ' class="hl"' : ''}><div class="x-name">${esc(l.name)}<small class="muted">${esc(l.section)}</small></div>
      <div class="x-vals"><span class="muted">${eur(l.before)}</span><span class="pos">+${eur(l.delta)}</span><b>${eur(l.after)}</b></div>
      ${l.changed ? `<p class="x-fix">Já lançado: +${eur(l.was || 0)} · corrigir <b>${money(r2(l.delta - (l.was || 0)), true)}</b></p>` : ''}</li>`).join('')}</ul>
    <button type="button" class="btn small" data-act="copy" data-text="${esc(tsvIncome)}">Copiar valores finais</button>` : '<p class="muted">Nada a somar.</p>'}
  </section>
  ${p.exp.length ? `<section class="block"><h2>Budget Geral · Despesas (linhas novas)</h2>
    <div class="tablewrap"><table class="data"><thead><tr><th>Descrição</th><th>Data</th><th>Categoria</th><th>Nota</th><th>Valor</th></tr></thead><tbody>
    ${p.exp.map((x) => `<tr><td>${esc(x.desc)}</td><td>${esc(x.date)}</td><td>${esc(x.cat)}</td><td>${esc(x.note)}</td><td>${eur(x.value)}</td></tr>`).join('')}
    </tbody></table></div><button type="button" class="btn small" data-act="copy" data-text="${esc(tsvExp)}">Copiar linhas</button>
    <p class="hint">Cola na primeira linha vazia da tabela Despesas: as colunas ficam no sítio.</p></section>` : ''}
  ${p.users.length || p.extras.length ? `<section class="block"><h2>Users/Estadios</h2>
    ${p.users.length ? `<p>Na coluna <b>${esc(monthName(p.month))}</b>, marca ✓ em ${p.users.length} jogador(es):</p><ul class="namechips">${p.users.map((u) => `<li>${esc(u)}</li>`).join('')}</ul><button type="button" class="btn small" data-act="copy" data-text="${esc(p.users.join('\n'))}">Copiar nomes</button>` : ''}
    ${p.extras.length ? `<p>Em <b>Contribuição adicional</b>, soma:</p><ul class="kv">${p.extras.map((x) => `<li><span>${esc(x.name)}</span><span>+${eur(x.value)}</span></li>`).join('')}</ul>` : ''}
  </section>` : ''}
  <section class="block"><h2>Confirma os saldos</h2>
    <ul class="xlist">${p.funds.concat([{ name: 'Saldo Corrente', ...p.corrente, sum: true }]).map((f) => `<li${f.sum ? ' class="sum"' : ''}><div class="x-name">${esc(f.name)}</div>
      <div class="x-vals"><span class="muted">${eur(f.before)}</span>${f.delta ? money(f.delta, true) : '<span class="muted">—</span>'}<b>${eur(f.after)}</b></div></li>`).join('')}</ul>
    <p class="hint">Depois de preencheres, os cartões verdes do Excel devem mostrar estes valores. Se não mostrarem, há um erro no Excel.</p>
  </section>`;
}

function sheetBox(tid, moveId) {
  if (!linked()) return '';
  const P = sheetPayload(tid, moveId);
  const rep = UI.report && UI.report.id === (tid || moveId) ? UI.report : null;
  const rpt = rep ? `<div class="report-box">
      <p><b>Escrito no Sheets.</b> ${[rep.res.players && `${rep.res.players} jogador(es) novo(s)`, rep.res.checks && `${rep.res.checks} caixa(s) na semana`, rep.res.months && `${rep.res.months} caixa(s) no mês`, rep.res.extras && `${rep.res.extras} adicional`, rep.res.lines && `${rep.res.lines} linha(s)`, rep.res.despesas && `${rep.res.despesas} despesa(s)`].filter(Boolean).join(' · ') || 'Nada a mudar.'}</p>
      ${rep.res.notFound?.length ? `<p class="neg">Não encontrei no Sheets: ${esc([...new Set(rep.res.notFound)].join(', '))}. Confirma o nome na USER LIST e volta a escrever.</p>` : ''}
      ${rep.res.skipped?.length ? `<p class="neg">Não escrevi (célula com fórmula ou valor estranho): ${esc(rep.res.skipped.join(', '))}</p>` : ''}
      ${(rep.res.warnings || []).map((w) => `<p class="neg">${esc(w)}</p>`).join('')}
      ${rep.checks.length ? `<ul class="checks">${rep.checks.map((c) => `<li class="${c.ok ? 'pos' : 'neg'}">${c.ok ? '✓' : '✗'} ${esc(c.name)}: ${eur(c.got)}${c.ok ? '' : ` (esperava ${eur(c.expected)})`}</li>`).join('')}</ul>` : ''}
    </div>` : '';
  if (readOnly()) return `<section class="block"><h2>Google Sheets</h2><p class="muted">${P.summary.length ? 'Os organizadores ainda não escreveram isto no Sheets.' : '✓ O Sheets já tem tudo.'}</p></section>`;
  return `<section class="block sheetbox"><h2>Google Sheets</h2>
    ${rpt}
    ${P.manual.map((m) => `<p class="alert warn"><span class="dot"></span>${esc(m)}</p>`).join('')}
    ${P.summary.length ? `<p>A app vai escrever:</p><ul class="todo">${P.summary.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <button type="button" class="btn primary" data-act="write-sheet" data-tid="${tid || ''}" data-mid="${moveId || ''}">Escrever no Sheets</button>
      <p class="hint">Só marca caixas, soma na "Contribuição adicional", acrescenta linhas em Despesas e nomes novos na USER LIST. Nunca mexe em fórmulas. Depois relê os saldos e confirma que batem.</p>`
      : `<p class="allgood">✓ O Sheets já tem tudo${tid ? ' deste torneio' : ''}.</p>`}
  </section>`;
}

function vExcel(t) {
  const p = excelPlan(t.id);

  if (linked() && !t.example) {

/* --- Formulário do torneio e partes da inscrição --- */
function compEditor(comps) {
  const row = (c) => `<div class="comp-edit ${c.kind === 'loja' ? 'is-loja' : ''}" data-key="${esc(c.key)}">
    <div class="comp-top"><span class="comp-n"></span><button type="button" class="link danger" data-act="rm-comp">Remover parte</button></div>
    <div class="row2"><label class="field">Parte<input name="cl_${c.key}" value="${esc(c.label)}"></label><label class="field">Preço<input name="cp_${c.key}" inputmode="decimal" value="${esc(eurPlain(c.price))}"></label></div>
    <label class="field">Vai para<select name="cd_${c.key}">${S.stores.map((s) => opt('store:' + s.id, s.name + ' (paga-se à loja)', c.kind === 'loja' && c.storeId === s.id)).join('')}${SECTIONS.map((sec) => `<optgroup label="Excel · ${esc(sec)}">${S.lines.filter((l) => l.section === sec).map((l) => opt('line:' + l.id, l.name, c.kind === 'line' && c.lineId === l.id)).join('')}</optgroup>`).join('')}</select></label>
    <div class="comp-foot"><label class="check"><input type="checkbox" name="cf_${c.key}" ${c.def ? 'checked' : ''}> Marcada por defeito</label><label class="check"><input type="checkbox" name="cm_${c.key}" ${c.monthly ? 'checked' : ''}> Uma vez por mês</label></div>
  </div>`;
  compEditor.row = row;
  return `<fieldset class="comps parts"><legend>Partes de cada inscrição</legend><div id="compList">${comps.map(row).join('')}</div><button type="button" class="btn small" data-act="add-comp">Adicionar parte</button></fieldset>`;
}
function readComps(fd, form, old) {
  return $$('.comp-edit', form).map((el) => {
    const k = el.dataset.key;
    const dest = String(fd.get('cd_' + k) || '');
    const prev = old.find((c) => c.key === k) || {};
    const c = { key: k, label: String(fd.get('cl_' + k)).trim(), price: r2(num(fd.get('cp_' + k))), def: !!fd.get('cf_' + k), monthly: !!fd.get('cm_' + k), extra: !!prev.extra };
    if (dest.startsWith('store:')) { c.kind = 'loja'; c.storeId = dest.slice(6); } else { c.kind = 'line'; c.lineId = dest.slice(5); }
    return c;
  });
}

function tabOpts(sel) {
  const tabs = (S.sheet?.comps || []).map((c) => c.tab);
  if (sel && !tabs.some((x) => normName(x) === normName(sel))) tabs.unshift(sel);
  return opt('', '— sem aba —', !sel) + tabs.map((x) => opt(x, x + ((S.sheet?.comps || []).find((c) => c.tab === x)?.hidden ? ' (oculta)' : ''), normName(x) === normName(sel))).join('');
}
function weekOpts(tab, sel) {
  const c = sheetComp(tab);
  if (!c) return opt('', tab ? 'Aba não encontrada no Sheets' : '—', true);
  const usedBy = {};
  S.tournaments.filter((t) => !t.example && normName(t.sheetTab) === normName(tab) && t.sheetWeek).forEach((t) => { usedBy[t.sheetWeek] = t.name; });
  return opt('', '— escolher —', !sel) + c.weeks.map((w) => opt(w.key, `${w.label} · ${w.players ? w.players + ' jogadores' : 'vazia'}${usedBy[w.key] ? ' · app: ' + usedBy[w.key] : ''}`, w.key === sel)).join('');
}

function tourForm(t) {
  const type0 = S.types[0];
  const d = t || { name: '', date: todayISO(), typeId: type0?.id, organizerId: (playerById(meId())?.org && meId()) || S.settings.treasurerId, comps: [] };
  const autoName = (typeId, date) => `${typeById(typeId)?.name || 'Torneio'} · ${fmtDate(date).slice(0, 5)}`;
  openSheet({
    title: t ? 'Editar torneio' : 'Novo torneio',
    submit: t ? 'Guardar' : 'Criar e abrir check-in',
    del: t ? () => { S.tournaments = S.tournaments.filter((x) => x.id !== t.id); S.entries = S.entries.filter((x) => x.tid !== t.id); S.moves = S.moves.filter((x) => x.tid !== t.id); UI.tid = null; } : null,
    delLabel: 'Apagar torneio',
    body: `
      <label class="field">Tipo<select name="typeId">${S.types.map((x) => opt(x.id, x.name, x.id === d.typeId)).join('')}</select></label>
      <div class="row2"><label class="field">Data<input type="date" name="date" value="${esc(d.date)}"></label>
      <label class="field">Quem organiza<select name="organizerId">${orgOpts(d.organizerId)}</select></label></div>
      <label class="field">Nome<input name="name" value="${esc(d.name || autoName(d.typeId, d.date))}" data-auto="${t ? '' : '1'}"></label>
      <div id="miscField"${typeById(d.typeId)?.special ? '' : ' hidden'}>
        <label class="field">Linha no Budget Geral (Income Misc)<input name="miscLine" value="${esc(d.miscLine || '')}" placeholder="ex.: Torneio Exterior Porto 2026"></label>
        <p class="hint">Evento fora das lojas: não há aba de competição. As inscrições vão para esta linha em Income Misc (conta para o saldo de Estádios e Material). Se a linha não existir, a app cria-a numa das linhas vazias ao escrever no Sheets.</p>
      </div>
      ${S.sheet ? `<div class="row2" id="sheetFields"${typeById(d.typeId)?.special ? ' hidden' : ''}><label class="field">Aba no Sheets<select name="sheetTab">${tabOpts(d.sheetTab || typeById(d.typeId)?.sheetTab)}</select></label>
      <label class="field">Semana no Sheets<select name="sheetWeek" id="weekSel">${weekOpts(d.sheetTab || typeById(d.typeId)?.sheetTab, t ? d.sheetWeek : suggestWeek(typeById(d.typeId)?.sheetTab))}</select></label></div>
      <p class="hint" id="sheetHint"${typeById(d.typeId)?.special ? ' hidden' : ''}>A app sugere a primeira semana vazia. É nessa coluna que os pagamentos vão ser marcados.</p>` : ''}
      ${t ? compEditor(t.comps) + '<p class="hint">Mudar as partes aqui só afeta este torneio. Para mudar todos os futuros, edita o tipo em Mais.</p>' : '<p class="hint">Os preços e linhas do Excel vêm do tipo de torneio (Mais › Tipos de torneio). Podes ajustá-los depois em Editar.</p>'}
      ${t ? '<p class="hint">Apagar o torneio apaga também o check-in e os movimentos dele.</p>' : ''}`,
    onMount: (form) => {
      const toggleSpecial = () => {
        const sp = !!typeById(form.elements.typeId.value)?.special;
        $('#miscField').hidden = !sp;
        if ($('#sheetFields')) { $('#sheetFields').hidden = sp; $('#sheetHint').hidden = sp; }
        if (sp && !form.elements.miscLine.value) form.elements.miscLine.value = form.elements.name.value;
      };
      form.elements.typeId.addEventListener('change', toggleSpecial);
      if (form.elements.sheetTab) {
        form.elements.typeId.addEventListener('change', () => { const tab = typeById(form.elements.typeId.value)?.sheetTab || ''; form.elements.sheetTab.innerHTML = tabOpts(tab); $('#weekSel').innerHTML = weekOpts(tab, suggestWeek(tab)); });
        form.elements.sheetTab.addEventListener('change', () => { const tab = form.elements.sheetTab.value; $('#weekSel').innerHTML = weekOpts(tab, (t && t.sheetTab === tab) ? t.sheetWeek : suggestWeek(tab)); });
      }
      if (t) return;
      const nameI = form.elements.name;
      nameI.addEventListener('input', () => { nameI.dataset.auto = ''; });
      form.addEventListener('change', () => { if (nameI.dataset.auto) nameI.value = autoName(form.elements.typeId.value, form.elements.date.value); });
    },
    onSubmit: (fd, form) => {
      const name = String(fd.get('name')).trim();
      if (!name) return 'Dá um nome ao torneio.';
      if (!fd.get('organizerId')) return 'Escolhe quem organiza (marca organizadores em Jogadores).';
      const special = !!typeById(fd.get('typeId'))?.special;
      const miscName = special ? String(fd.get('miscLine') || name).trim() : '';
      const useMisc = (comps) => {
        if (!special) return comps;
        const lid = ensureMiscLine(miscName);
        return comps.map((c) => (c.kind === 'line' && !c.monthly && !c.extra ? { ...c, lineId: lid } : c));
      };
      if (t) {
        const comps = readComps(fd, form, t.comps);
        if (comps.some((c) => !c.label)) return 'Cada parte precisa de nome.';
        const gone = t.comps.filter((c) => !comps.some((x) => x.key === c.key) && S.entries.some((e) => e.tid === t.id && e.amt[c.key] != null));
        if (gone.length) return `"${gone[0].label}" tem valores no check-in. Desmarca-a nos jogadores antes de a remover.`;
        Object.assign(t, { name, date: fd.get('date'), typeId: fd.get('typeId'), organizerId: fd.get('organizerId'), comps: useMisc(comps), miscLine: miscName });
        if (special) Object.assign(t, { sheetTab: '', sheetWeek: '' });
        else if (fd.has('sheetTab')) Object.assign(t, { sheetTab: fd.get('sheetTab') || '', sheetWeek: fd.get('sheetWeek') || '' });
      } else {
        const type = typeById(fd.get('typeId'));
        const id = uid('t');
        S.tournaments.push({ id, name, date: fd.get('date'), typeId: type.id, organizerId: fd.get('organizerId'), comps: useMisc(JSON.parse(JSON.stringify(type.comps))), notes: '', example: false, launched: null, sheetTab: special ? '' : fd.has('sheetTab') ? fd.get('sheetTab') : type.sheetTab || '', sheetWeek: special ? '' : fd.get('sheetWeek') || '', miscLine: miscName });
        UI.tid = id; UI.tTab = 'checkin'; UI.tab = 'torneios';
      }
      return null;
    },
  });
}

/* ---------- Jogadores ---------- */
function playerFilter() {
  const q = UI.pq.trim().toLowerCase();
  const month = UI.pm || monthKey(todayISO());
  return S.players.filter((p) => {
    if (q && !p.name.toLowerCase().includes(q)) return false;
    if (!UI.pf || UI.pf === 'all') return true;
    const paid = !!monthlyPaidElsewhere(p.id, month);
    return UI.pf === 'paid' ? paid : !paid;
  });
}
function vPlayers() {
  const cur = monthKey(todayISO());
  const month = UI.pm || cur;
  const paidN = S.players.filter((p) => monthlyPaidElsewhere(p.id, month)).length;
  const list = playerFilter();
  const y = month.slice(0, 4);
  return `
  <header class="top"><div><p class="eyebrow">${S.players.length} jogadores</p><h1>Jogadores</h1></div><button type="button" class="btn primary editonly" data-act="new-player">Adicionar</button></header>
  <section class="monthbar">
    <div class="monthnav"><button type="button" class="icon-btn" data-act="pm" data-d="-1" aria-label="Mês anterior"${month.endsWith('-01') ? ' disabled' : ''}>‹</button>
      <div class="mn"><b>${esc(monthName(month))} ${y}</b>${month === cur ? chip('mês atual', 'soft') : `<button type="button" class="link small" data-act="pm" data-d="0">voltar ao mês atual</button>`}</div>
      <button type="button" class="icon-btn" data-act="pm" data-d="1" aria-label="Mês seguinte"${month.endsWith('-12') ? ' disabled' : ''}>›</button></div>
    <p class="muted small">Mensal de estádios: <b>${paidN}</b> pagaram · ${S.players.length - paidN} não pagaram</p>
    <div class="mini-seg">${[['all', 'Todos'], ['paid', 'Pagaram'], ['unpaid', 'Não pagaram']].map(([k, l]) => `<button type="button" data-act="pf" data-f="${k}" aria-pressed="${(UI.pf || 'all') === k}">${l}</button>`).join('')}</div>
  </section>
  <input id="pSearch" type="search" autocomplete="off" placeholder="Procurar…" value="${esc(UI.pq)}" aria-label="Procurar jogador">

}

function playerRows(list, month) {
  return `${list.map((p) => {
    const paid = monthlyPaidElsewhere(p.id, month);
    const n = S.entries.filter((e) => e.playerId === p.id && !isExample(e.tid)).length;
    return `<li><button type="button" class="row" data-act="edit-player" data-id="${p.id}"><span class="row-main"><b>${esc(p.name)}</b><span class="muted small">${n} torneio(s) na app</span></span><span class="row-side">${paid ? chip('✓ ' + monthName(month).slice(0, 3), 'ok') : chip('— ' + monthName(month).slice(0, 3))}${p.org ? chip('organizador', 'soft') : ''}${p.inSheet === false ? chip('novo · ainda não está no Sheets', 'warn') : ''}</span></button></li>`;
  }).join('') || '<li class="muted pad">Nenhum jogador com esse nome.</li>'}`;
}

function playerForm(p, presetName, after) {
  const year = todayISO().slice(0, 4);
  const hist = p ? S.entries.filter((e) => e.playerId === p.id && !isExample(e.tid)).map((e) => ({ t: tourById(e.tid), e })).filter((x) => x.t).sort((a, b) => b.t.date.localeCompare(a.t.date)) : [];
  const used = p && (S.entries.some((e) => e.playerId === p.id || e.recv === p.id) || S.moves.some((m) => [m.by, m.from, m.to, m.recv].includes(p.id)));
  openSheet({
    title: p ? p.name : 'Novo jogador',
    submit: readOnly() ? '' : 'Guardar',
    del: p && !used ? () => { S.players = S.players.filter((x) => x.id !== p.id); } : null,
    body: `
      <label class="field">Nome (como no Excel)<input name="name" value="${esc(p?.name || presetName || '')}" placeholder="username Challonge (Nome)"${linked() && p?.inSheet ? ' readonly' : ''}></label>
      ${linked() && p?.inSheet ? '<p class="hint">Para mudar o nome, muda-o na USER LIST do Sheets.</p>' : ''}
      ${linked() && !p ? '<p class="hint">Fica na app e é acrescentado à USER LIST na próxima vez que escreveres um torneio onde ele jogue.</p>' : ''}
      ${linked() && p ? `<p class="muted small">${p.org ? 'Organizador' : 'Jogador'}${LINK.organizers?.some((n) => normName(n) === normName(p.name)) ? ' (definido pela chave no script)' : ''}</p><input type="hidden" name="org" value="${p.org ? '1' : ''}">` : `<label class="check"><input type="checkbox" name="org" ${p?.org ? 'checked' : ''}> Organizador (recebe dinheiro nos torneios)</label>`}
      <fieldset class="comps"><legend>Mensal de estádios (${year})</legend>
        <div class="months">${MONTHS.map((m, i) => { const k = `${year}-${pad2(i + 1)}`; return `<label class="check"><input type="checkbox" name="mo_${k}" ${p?.months?.[k] ? 'checked' : ''}${linked() ? ' disabled' : ''}> ${m.slice(0, 3)}</label>`; }).join('')}</div>
        <p class="hint">${linked() ? 'Vem do Sheets (Users/Estadios). Muda-se ao escrever um torneio no Sheets, ou diretamente no ficheiro.' : 'Usa para meses pagos antes da app. Os pagos em torneios da app contam sozinhos.'}</p>
      </fieldset>
      ${hist.length ? `<h3 class="sub">Histórico</h3><ul class="kv">${hist.map(({ t, e }) => `<li><span>${esc(t.name)} <small class="muted">${fmtDate(t.date)}</small></span><span>${eur(entryTotal(e))} ${chip(METHOD[e.method], e.method === 'debt' ? 'warn' : '')}</span></li>`).join('')}</ul>` : ''}
      ${used ? '<p class="hint">Não dá para apagar: tem inscrições ou movimentos.</p>' : ''}`,
    onSubmit: (fd) => {
      const name = String(fd.get('name')).trim();
      if (!name) return 'Escreve o nome.';
      if (S.players.some((x) => x.id !== p?.id && x.name.toLowerCase() === name.toLowerCase())) return 'Já existe um jogador com esse nome.';
      const months = { ...(p?.months || {}) };
      if (!linked()) MONTHS.forEach((m, i) => { const k = `${year}-${pad2(i + 1)}`; if (fd.get('mo_' + k)) months[k] = true; else delete months[k]; });
      if (p) Object.assign(p, { name, org: !!fd.get('org'), months });

        let id = slugId(name); if (playerById(id)) id = uid('p');
        S.players.push({ id, name, org: !!fd.get('org'), months });
        if (after) after(id);
      }
      return null;
    },
  });
}

/* Formulários simples para entidades de configuração */
function simpleForm({ title, item, fields, onSave, onDelete, canDelete = true }) {
  openSheet({
    title,
    del: item && onDelete && canDelete && !(linked() && !item.missing && ('section' in item || 'saldo' in item || ('fundId' in item && !('opening' in item)))) ? onDelete : null,
    body: fields.map((f) => {
      const v = item ? item[f.k] : f.def;
      if (f.type === 'select') return `<label class="field">${esc(f.label)}<select name="${f.k}">${f.options.map(([val, lab]) => opt(val, lab, val === v)).join('')}</select></label>`;
      if (f.type === 'num') return `<label class="field">${esc(f.label)}<input name="${f.k}" inputmode="decimal" value="${esc(eurPlain(v || 0))}"></label>`;
      if (f.type === 'date') return `<label class="field">${esc(f.label)}<input type="date" name="${f.k}" value="${esc(v || '')}"></label>`;
      return `<label class="field">${esc(f.label)}<input name="${f.k}" value="${esc(v || '')}"></label>`;
    }).join('') + (item && !canDelete ? '<p class="hint">Não dá para apagar: está em uso.</p>' : ''),
    onSubmit: (fd) => {
      const d = {};
      for (const f of fields) {
        d[f.k] = f.type === 'num' ? r2(num(fd.get(f.k))) : String(fd.get(f.k) || '').trim();
        if (f.req && !d[f.k]) return `Preenche "${f.label}".`;
      }
      onSave(d);
      return null;
    },
  });
}

function typeForm(ty) {
  const used = ty && S.tournaments.some((t) => t.typeId === ty.id);
  const comps = ty ? ty.comps : [{ key: 'loja', label: 'Loja', price: 2, kind: 'loja', storeId: S.stores[0]?.id, def: true }, { key: 'main', label: 'Liga', price: 1, kind: 'line', lineId: S.lines[0]?.id, def: true }];

    body: `<label class="field">Nome<input name="name" value="${esc(ty?.name || '')}" placeholder="ex.: Liga Fénix Negra"></label>
      ${S.sheet ? `<label class="field">Aba no Sheets<select name="sheetTab">${tabOpts(ty?.sheetTab || '')}</select></label>` : `<label class="field">Aba no Sheets<input name="sheetTab" value="${esc(ty?.sheetTab || '')}" placeholder="ex.: Liga Fénix Negra - Season 2"></label>`}
      <p class="hint">Quando começar uma Season nova, cria a aba no Sheets e escolhe-a aqui.</p>

      <p class="hint">A Liga e a Semanal são exclusivas: um tipo de liga tem "Liga", um evento casual tem "Semanal estádios". A mensal fica marcada só para quem ainda não pagou nesse mês.</p>`,
    onSubmit: (fd, form) => {

      if (!name) return 'Dá um nome ao tipo.';
      const cs = readComps(fd, form, comps);
      if (!cs.length) return 'Adiciona pelo menos uma parte.';
      if (cs.some((c) => !c.label)) return 'Cada parte precisa de nome.';
      const sheetTab = String(fd.get('sheetTab') || '').trim();
      if (ty) Object.assign(ty, { name, comps: cs, sheetTab }); else S.types.push({ id: uid('t'), name, comps: cs, sheetTab });
      return null;
    },
  });
}

/* ---------- Render e eventos ---------- */
function render() {
  const active = document.activeElement;
  const keep = active && active.id && $('#main').contains(active) ? { id: active.id, s: active.selectionStart } : null;
  const main = $('#main');
  main.innerHTML = UI.tab === 'resumo' ? vResumo() : UI.tab === 'torneios' ? (UI.tid ? vTour() : vTours()) : UI.tab === 'jogadores' ? vPlayers() : vMais();
  $$('.tabbar button').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === UI.tab ? 'page' : 'false'));
  document.body.classList.toggle('readonly', readOnly());
  const ib = $('#installBtn'); if (ib && window.__installPrompt) ib.hidden = false;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.s); } catch (e) { /* */ } } }
  saveUI();
}

function quickAction(t) {
  const kind = t.dataset.kind, pid = t.dataset.pid, amt = num(t.dataset.amt), tid = t.dataset.tid || null;
  if (kind === 'send') moveForm('envio', null, { tid, from: pid, to: S.settings.treasurerId, amount: amt });
  else if (kind === 'deposit') moveForm('deposito', null, { tid, by: pid, accountId: t.dataset.acc, amount: amt });
  else if (kind === 'refund') moveForm('reembolso', null, { tid, to: pid, amount: amt });
  else if (kind === 'loja') moveForm('loja', null, { tid, by: pid, storeId: t.dataset.store, amount: amt });
}

function onClick(ev) {
  const t = ev.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const tour = tourById(UI.tid);
  const SAFE = ['tab', 'close-sheet', 'open-tour', 'open-excel', 'back', 't-tab', 'copy', 'exp-checkin', 'exp-excel', 'exp-tour', 'exp-backup', 'copy-backup', 'install', 'sync-now', 'link-on', 'link-off', 'link-share', 'reload-sheet', 'pm', 'pf', 'edit-player'];
  if (readOnly() && !SAFE.includes(act)) { toast('Modo de leitura: só os organizadores podem alterar.'); return; }
  switch (act) {
    case 'sync-now': syncNow({ sheet: true }); break;
    case 'pm': {
      const cur = UI.pm || monthKey(todayISO());
      const d = +t.dataset.d;
      if (!d) UI.pm = ''; else { const m = Math.min(12, Math.max(1, +cur.slice(5, 7) + d)); UI.pm = `${cur.slice(0, 4)}-${pad2(m)}`; if (UI.pm === monthKey(todayISO())) UI.pm = ''; }
      render(); break;
    }
    case 'pf': UI.pf = t.dataset.f; render(); break;
    case 'reload-sheet': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Toca outra vez para descarregar tudo'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Voltar a descarregar tudo do Sheets'; } }, 3500); break; }
      if (pendingCount()) { toast('Há alterações por enviar. Espera que sincronize primeiro.'); syncNow(); break; }
      reloadFromSheet().then(() => toast('Tudo descarregado outra vez do Sheets')).catch((e) => toast(e.message));
      break;
    }
    case 'link-on': {
      t.disabled = true; t.textContent = 'A ligar…';
      connect($('#linkUrl').value, $('#linkKey').value)
        .then((r) => { toast(`Ligado a ${r.file} (${r.role === 'org' ? 'organizador' : 'só leitura'})`); render(); })
        .catch((e) => { render(); toast(e.message); });
      break;
    }
    case 'link-off':
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Toca outra vez para desligar'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Desligar'; } }, 3500); break; }
      disconnect(); saveLocal(); render(); toast('Desligado do Google Sheets'); break;
    case 'link-share': {
      const base = location.protocol.startsWith('http') && !/claude|claudeusercontent/.test(location.host) ? location.origin + location.pathname : 'https://<o-teu-utilizador>.github.io/caixa-bbpt/';
      copyText(`${base}?sheet=${encodeURIComponent(LINK.url)}&key=${encodeURIComponent(LINK.key)}`, 'Link copiado. Envia só a organizadores.');
      break;
    }
    case 'write-sheet': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Toca outra vez para escrever'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Escrever no Sheets'; } }, 4000); break; }
      t.disabled = true; t.textContent = 'A escrever…';
      const inSheet = !$('#sheet').hidden;
      writeToSheet(t.dataset.tid || null, t.dataset.mid || null)
        .then((r) => { const bad = r.checks.filter((c) => !c.ok).length; toast(bad ? `Escrito, mas ${bad} valor(es) não batem. Vê o relatório.` : 'Escrito no Sheets e confirmado ✓'); if (inSheet) closeSheet(); render(); })
        .catch((e) => { toast(e.message.includes('fetch') ? 'Sem ligação. Tenta outra vez quando houver rede.' : e.message); if (t.isConnected) { t.disabled = false; t.textContent = 'Escrever no Sheets'; } });
      break;
    }
    case 'tab': if (UI.tab === t.dataset.tab && UI.tab === 'torneios') UI.tid = null; UI.tab = t.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'close-sheet': closeSheet(); break;
    case 'open-tour': UI.tid = id; UI.tTab = 'checkin'; UI.q = ''; render(); window.scrollTo(0, 0); break;
    case 'open-excel': UI.tab = 'torneios'; UI.tid = id; UI.tTab = 'excel'; render(); window.scrollTo(0, 0); break;
    case 'back': UI.tid = null; render(); break;
    case 't-tab': UI.tTab = t.dataset.tab; render(); break;
    case 'new-tour': tourForm(null); break;
    case 'edit-tour': tourForm(tourById(id)); break;
    case 'ci-add': addEntry(tour, id); break;
    case 'ci-new': playerForm(null, UI.q.trim(), (pid) => { setTimeout(() => addEntry(tour, pid), 0); }); break;
    case 'new-method': S.settings.newMethod = t.dataset.m; save(); render(); break;
    case 'tog': {
      const e = S.entries.find((x) => x.id === id); const tt = tourById(e.tid); const c = compOf(tt, t.dataset.key);
      if (e.amt[c.key] != null) delete e.amt[c.key]; else e.amt[c.key] = c.price;
      save(); render(); break;
    }
    case 'set-method': {
      const e = S.entries.find((x) => x.id === id); const tt = tourById(e.tid);
      const prev = e.method; e.method = t.dataset.m;
      if (e.method === 'own') e.recv = e.playerId; else if (prev === 'own') e.recv = tt.organizerId;
      save(); render(); break;
    }
    case 'ci-more': entrySheet(S.entries.find((x) => x.id === id)); break;
    case 'new-move': moveForm(t.dataset.kind, null, { storeId: t.dataset.store || '', tid: t.dataset.general || UI.tab !== 'torneios' ? null : UI.tid }); break;
    case 'edit-move': moveForm(null, S.moves.find((x) => x.id === id)); break;
    case 'quick': quickAction(t); break;
    case 'launch': launch(id, null, true); save(); render(); toast('Marcado como lançado no Excel'); break;
    case 'unlaunch': launch(id, null, false); save(); render(); break;
    case 'launch-move': launch(null, id, true); closeSheet(); save(); render(); toast('Marcado como lançado no Excel'); break;
    case 'unlaunch-move': launch(null, id, false); closeSheet(); save(); render(); break;
    case 'add-comp': { const k = uid('k'); $('#compList').insertAdjacentHTML('beforeend', compEditor.row({ key: k, label: '', price: 0, kind: 'line', lineId: S.lines[0]?.id, def: false })); break; }
    case 'rm-comp': t.closest('.comp-edit').remove(); break;
    case 'new-player': playerForm(null, UI.pq.trim()); break;
    case 'edit-player': playerForm(playerById(id)); break;
    case 'new-type': typeForm(null); break;
    case 'edit-type': typeForm(typeById(id)); break;
    case 'new-line': lineForm(null); break;
    case 'edit-line': lineForm(lineById(id)); break;
    case 'new-fund': fundForm(null); break;
    case 'edit-fund': fundForm(fundById(id)); break;
    case 'new-acc': accForm(null); break;
    case 'edit-acc': accForm(accById(id)); break;
    case 'new-cat': catForm(null); break;
    case 'edit-cat': catForm(catById(id)); break;
    case 'new-store': storeForm(null); break;
    case 'edit-store': storeForm(storeById(id)); break;
    case 'copy': copyText(t.dataset.text); break;
    case 'exp-checkin': exportFile(`checkin-${slug(tourById(id).name)}.csv`, csvCheckin(id), 'text/csv;charset=utf-8'); break;
    case 'exp-excel': exportFile(`excel-${slug(tourById(id).name)}.csv`, csvExcel(id), 'text/csv;charset=utf-8'); break;
    case 'exp-tour': exportFile(`torneio-${slug(tourById(id).name)}.json`, JSON.stringify(exportBundle(id), null, 1), 'application/json'); break;
    case 'exp-backup': exportFile(`caixa-bbpt-${todayISO()}.json`, JSON.stringify(exportBundle(), null, 1), 'application/json'); break;
    case 'copy-backup': copyText(JSON.stringify(exportBundle()), 'Cópia de segurança copiada'); break;
    case 'import': if (linked()) { toast('Com o Google Sheets ligado, importar está desligado para não estragar os dados partilhados.'); break; } doImport(t.dataset.mode, t); break;
    case 'add-example': addExample(); save(); render(); toast('Torneio de exemplo adicionado'); break;
    case 'rm-example': {
      const ids = S.tournaments.filter((x) => x.example).map((x) => x.id);
      S.tournaments = S.tournaments.filter((x) => !x.example); S.entries = S.entries.filter((e) => !ids.includes(e.tid)); S.moves = S.moves.filter((m) => !ids.includes(m.tid));
      if (ids.includes(UI.tid)) UI.tid = null; save(); render(); toast('Exemplo apagado'); break;
    }
    case 'reset':
      if (linked()) { toast('Com o Google Sheets ligado, isto apagaria os dados de todos. Usa "Voltar a descarregar tudo do Sheets".'); break; }
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Toca outra vez: apaga torneios e movimentos'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Repor dados iniciais'; } }, 3500); break; }
      S = seed(); UI.tid = null; save(); render(); toast('Dados iniciais repostos'); break;
    case 'install': if (window.__installPrompt) { window.__installPrompt.prompt(); window.__installPrompt = null; t.hidden = true; } break;
    default: break;
  }
}

function onInput(ev) {
  const t = ev.target;
  if (t.id === 'ciSearch') { UI.q = t.value; const r = $('#ciResults'); if (r) r.innerHTML = ciResults(tourById(UI.tid)); }
  if (t.id === 'pSearch') { UI.pq = t.value; $('#pList').innerHTML = playerRows(playerFilter(), UI.pm || monthKey(todayISO())); }
}
function onKey(ev) {
  if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (ev.key === 'Enter' && ev.target.id === 'ciSearch') {
    ev.preventDefault();
    const first = $('.results .result');
    if (first) first.click();
  }
}
function onChange(ev) {
  const t = ev.target;
  if (t.id === 'treasurer') { S.settings.treasurerId = t.value; save(); render(); }
  if (t.id === 'meLocal') { LINK.meLocal = t.value; saveLink(); render(); }
  if (t.id === 'withPlayers') { UI.withPlayers = t.checked; render(); }
}

async function doImport(mode, btn) {
  const file = $('#importFile')?.files?.[0];
  let text = $('#importText')?.value.trim();
  if (file) text = await file.text();
  if (!text) { toast('Escolhe um ficheiro ou cola o conteúdo primeiro.'); return; }
  if (mode === 'replace' && !btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = 'Toca outra vez para substituir tudo'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'Substituir tudo'; } }, 3500); return; }
  try {
    const r = importData(JSON.parse(text), mode);
    save(); render();
    toast(`Importado: ${r.t} torneio(s), ${r.e} inscrições, ${r.m} movimentos`);
  } catch (e) {
    toast(e.message && e.message.includes('Caixa') ? e.message : 'O conteúdo não é um ficheiro válido da Caixa BBPT.');
  }
}

function boot() {
  S = load();
  loadUI();
  loadLink();
  const fromUrl = linkFromUrl();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__installPrompt = e; const b = $('#installBtn'); if (b) b.hidden = false; });
  document.body.classList.toggle('readonly', readOnly());
  render();
  startPolling();
  if (fromUrl) connect(fromUrl.url, fromUrl.key).then((r) => toast(`Ligado a ${r.file}`)).catch((e) => toast(e.message));
  else if (LINK.url) syncNow({ sheet: true });
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.__PWA__) navigator.serviceWorker.register('./sw.js').catch(() => { /* sem modo offline */ });
  if (!window.__PWA__ && window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then((d) => { DL = d; }).catch(() => { /* */ });
}
boot();

</script>
