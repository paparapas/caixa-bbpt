<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa BBPT</title>
<meta name="description" content="Contas dos torneios: inscrições, loja, liga, estádios e acertos entre organizadores.">
<meta name="theme-color" content="#040F22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caixa BBPT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3.3.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: uma coluna para o telemóvel (máx. 680px), barra de separadores fixa em baixo; os fundos aparecem como cartões de banco azuis, o resto fica sóbrio. */
:root {
  --bg: #EDF0F6;
  --surface: #FFFFFF;
  --surface-2: #F5F7FB;
  --line: #D8DDE8;
  --fg: #111727;
  --muted: #5A6377;
  --accent: #2040C0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E8FB;
  --cash: #8A4A0B;
  --cash-bg: #F8EADB;
  --card: #132164;
  --card-2: #1F3AB4;
  --card-ink: #F3F5FF;
  --card-muted: #AFBAEC;
  --ok: #1B7A4A;
  --ok-bg: #E1F2E8;
  --warn: #8F5500;
  --warn-bg: #FBEFD6;
  --bad: #B3261E;
  --bad-bg: #FCE6E3;
  --shadow: 0 1px 2px rgb(17 23 39 / 0.06), 0 6px 20px rgb(17 23 39 / 0.06);
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --radius: 14px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0E1A; --surface: #131A2B; --surface-2: #19223A; --line: #283252; --fg: #E6E9F3; --muted: #98A2BA;
    --accent: #8EA3FF; --accent-ink: #0A0E1A; --accent-soft: #1D2850; --cash: #F2B27A; --cash-bg: #3A2614;
    --card: #17236B; --card-2: #2846D0; --card-ink: #F3F5FF; --card-muted: #BAC4F4;
    --ok: #5CCB8E; --ok-bg: #11301F; --warn: #F0B44E; --warn-bg: #33260C; --bad: #FF8378; --bad-bg: #3A1613;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0E1A; --surface: #131A2B; --surface-2: #19223A; --line: #283252; --fg: #E6E9F3; --muted: #98A2BA;
  --accent: #8EA3FF; --accent-ink: #0A0E1A; --accent-soft: #1D2850; --cash: #F2B27A; --cash-bg: #3A2614;
  --card: #17236B; --card-2: #2846D0; --card-ink: #F3F5FF; --card-muted: #BAC4F4;
  --ok: #5CCB8E; --ok-bg: #11301F; --warn: #F0B44E; --warn-bg: #33260C; --bad: #FF8378; --bad-bg: #3A1613;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body.locked { overflow: hidden; }
#main { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 12px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: 2.2rem; font-weight: 700; line-height: 1; }
h2 { font-size: 1.25rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
h3 { font-size: 1.15rem; font-weight: 600; }
h3.sub { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 6px; }
p { margin: 0; }
small, .small { font-size: 0.82rem; }
.muted { color: var(--muted); }
.num, .fc-big, .stats b, td, .total b { font-variant-numeric: tabular-nums; }
.num.pos { color: var(--ok); } .num.neg { color: var(--bad); }
.eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }

/* Topo */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 10px; }
.today { color: var(--muted); font-variant-numeric: tabular-nums; }
.ev-top { display: grid; grid-template-columns: 1fr; align-items: start; gap: 8px; }
.ev-title { min-width: 0; }
.ev-title h1 { font-size: 1.9rem; }
.ev-tools { display: flex; gap: 8px; }
.back { justify-self: start; }

.banner { background: var(--accent-soft); color: var(--fg); border-radius: var(--radius); padding: 12px 14px; font-size: 0.92rem; }

/* Cartões dos fundos */
.funds { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.fundcard { position: relative; overflow: hidden; border-radius: 18px; padding: 18px 18px 16px; color: var(--card-ink); background: linear-gradient(160deg, var(--card-2) 0%, var(--card) 70%); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fundcard::after { content: ''; position: absolute; right: -40px; top: -60px; width: 180px; height: 180px; border-radius: 50%; border: 22px solid rgb(255 255 255 / 0.06); pointer-events: none; }
.fc-acc { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--card-muted); font-weight: 600; }
.fundcard h3 { font-size: 1.05rem; font-weight: 500; color: var(--card-ink); font-family: var(--f-body); }
.fc-big { font-family: var(--f-display); font-size: 2.6rem; font-weight: 700; line-height: 1.05; margin: 6px 0 10px; }
.fc-meta { display: flex; gap: 18px; margin: 0; flex-wrap: wrap; }
.fc-meta div { min-width: 0; }
.fc-meta dt { font-size: 0.74rem; color: var(--card-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.fc-meta dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Blocos */
.block { display: flex; flex-direction: column; gap: 10px; }
.verify { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--line); }
.verify .verdict { font-weight: 600; }
.verify.ok .verdict { color: var(--ok); } .verify.bad .verdict { color: var(--bad); }
.allgood { color: var(--ok); font-weight: 600; }
.hint { color: var(--muted); font-size: 0.88rem; max-width: 65ch; }
.note { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; color: var(--muted); }
.empty { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 22px 18px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }

/* Acertos */
.settle { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.settle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; border-radius: 12px; padding: 12px 14px; flex-wrap: wrap; }
.settle-row.warn { border-left-color: var(--warn); } .settle-row.bad { border-left-color: var(--bad); } .settle-row.ok { border-left-color: var(--ok); }
.settle-who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; flex: 1 1 200px; }

.alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 0.92rem; }
.alert .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
.alert.warn { background: var(--warn-bg); } .alert.warn .dot { background: var(--warn); }
.alert.bad { background: var(--bad-bg); } .alert.bad .dot { background: var(--bad); }
.alert.info { background: var(--surface-2); } .alert.info .dot { background: var(--accent); }

/* Chips */
.chip { display: inline-flex; align-items: center; font-size: 0.74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.soft { background: var(--accent-soft); color: var(--accent); } .chip.cash { background: var(--cash-bg); color: var(--cash); }

/* Botões */
.btn { font: inherit; font-weight: 600; font-size: 0.95rem; border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger, .link.danger { color: var(--bad); }
.btn.small { min-height: 38px; padding: 7px 12px; font-size: 0.88rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.link { font: inherit; background: none; border: 0; color: var(--accent); padding: 6px 0; cursor: pointer; font-weight: 600; }
.icon-btn { font: inherit; background: var(--surface-2); border: 0; border-radius: 50%; width: 36px; height: 36px; color: var(--fg); cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { display: flex; gap: 8px; align-items: center; }
.bar.wrap { flex-wrap: wrap; }

/* Lista de torneios */
.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.evcard { width: 100%; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; cursor: pointer; }
.evcard:hover { border-color: var(--accent); }
.ev-date { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.ev-name { font-family: var(--f-display); font-size: 1.4rem; font-weight: 600; line-height: 1.1; }
.ev-meta { color: var(--muted); font-size: 0.9rem; }
.ev-state { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

/* Estatísticas do torneio */
.stats { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stats div { background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; flex: 1 1 30%; min-width: 96px; }
.stats span { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.stats b { font-family: var(--f-display); font-size: 1.45rem; font-weight: 600; }
.stats small { font-size: 0.85rem; color: var(--muted); font-family: var(--f-body); }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.seg button { font: inherit; font-size: 0.88rem; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 9px 4px; border-radius: 9px; cursor: pointer; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

/* Linhas */
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.rows li + li { border-top: 1px solid var(--line); }
.row { width: 100%; font: inherit; color: inherit; background: none; border: 0; text-align: left; display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; cursor: pointer; }
.row:hover { background: var(--surface-2); }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.row-main b { overflow-wrap: anywhere; }
.row-main .muted { font-size: 0.86rem; }
.row-kicker { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; text-align: right; }
.row-side .num { font-weight: 600; }
.row-tags { display: flex; gap: 4px; }

/* Cartões por pessoa */
.pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pcard header { display: flex; align-items: center; gap: 8px; }
.pcard-act { font-weight: 600; }
.pcard.warn .pcard-act { color: var(--warn); } .pcard.bad .pcard-act { color: var(--bad); } .pcard.ok .pcard-act { color: var(--ok); }
.calc { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
.calc td { padding: 4px 0; vertical-align: top; }
.calc td:last-child { text-align: right; white-space: nowrap; padding-left: 12px; }
.calc tfoot td { border-top: 1.5px solid var(--fg); padding-top: 6px; font-weight: 700; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.data { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
.data th, .data td { padding: 9px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
.data th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); }
.data tr:last-child td { border-bottom: 0; }
.data td:not(:first-child), .data th:not(:first-child) { text-align: right; }

.kv { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.kv li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; flex-wrap: wrap; }
.kv li + li { border-top: 1px solid var(--line); }
.kv li > span:first-child { min-width: 0; flex: 1 1 160px; }
.kv li:has(.linkrow) { padding: 0; }
.linkrow { width: 100%; font: inherit; color: inherit; background: none; border: 0; text-align: left; display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; cursor: pointer; }
.linkrow:hover { background: var(--surface-2); }

.report { font-family: var(--f-mono); font-size: 0.8rem; line-height: 1.5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-height: 420px; overflow-y: auto; }

/* Formulários */
.field { display: flex; flex-direction: column; gap: 5px; font-size: 0.85rem; font-weight: 600; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea, .comp-row input { font: inherit; font-size: 16px; font-weight: 400; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
.field textarea { min-height: 70px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .comp-row input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.check { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.comps { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.comps legend { font-size: 0.85rem; font-weight: 600; color: var(--muted); padding: 0 4px; }
.comp-row { display: grid; grid-template-columns: 1fr 96px; align-items: center; gap: 10px; }
.comp-row input { text-align: right; }
.comp-edit { border-bottom: 1px dashed var(--line); padding-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.comp-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; padding-top: 4px; }
.total b { font-family: var(--f-display); font-size: 1.6rem; }
.form-err { color: var(--bad); font-weight: 600; font-size: 0.9rem; }

/* Folha */
#sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgb(8 12 24 / 0.5); }
.sheet { position: relative; width: 100%; max-width: 600px; max-height: 92%; background: var(--bg); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgb(0 0 0 / 0.25); animation: rise 0.22s ease-out; }
@media (min-width: 700px) { #sheet { align-items: center; } .sheet { border-radius: 20px; max-height: 88%; } }
@keyframes rise { from { transform: translateY(30px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 8px; gap: 12px; }
.sheet-head h2 { color: var(--fg); text-transform: none; letter-spacing: 0.01em; font-size: 1.5rem; }
.sheet-body { overflow-y: auto; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.sheet-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.sheet-actions { display: flex; justify-content: space-between; gap: 10px; }
.sheet-actions .primary { flex: 0 1 200px; }

/* Barra de separadores */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar button { font: inherit; font-size: 0.74rem; font-weight: 600; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; cursor: pointer; border-radius: 10px; min-height: 50px; }
.tabbar svg { width: 24px; height: 24px; fill: currentColor; }
.tabbar button[aria-current="page"] { color: var(--accent); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px); z-index: 60; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow); }

@media (max-width: 420px) {
  .row2 { grid-template-columns: 1fr; }
  .comp-row { grid-template-columns: 1fr 88px; }
  h1 { font-size: 2rem; }
  .fc-big { font-size: 2.3rem; }
}
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

/* ---------- v2: check-in e afins ---------- */
.fundcard.total { background: linear-gradient(160deg, var(--surface-2) 0%, var(--surface) 100%); color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.fundcard.total .fc-acc { color: var(--muted); } .fundcard.total h3 { color: var(--fg); } .fundcard.total::after { display: none; }
.funds .fc-big { font-size: 2.2rem; margin-bottom: 0; }
.stats .debt b { color: var(--warn); }
.compline { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.9rem; color: var(--muted); }
.compline b { color: var(--fg); font-variant-numeric: tabular-nums; }
.seg { grid-template-columns: repeat(5, 1fr); }
.seg button { font-size: 0.8rem; padding: 9px 2px; }
.ev-tools { align-items: center; flex-wrap: wrap; }

.addbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
#ciSearch, #pSearch { font: inherit; font-size: 17px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 48px; width: 100%; }
#ciSearch:focus, #pSearch:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.newmethod { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.result { width: 100%; text-align: left; font: inherit; font-weight: 600; color: var(--fg); background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; padding: 11px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 46px; }
.result:hover, .result:focus-visible { border-color: var(--accent); }
.result.new { color: var(--accent); background: var(--accent-soft); }

.mini-seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }

function seed() { const s = baseState(); delete s._ids; addExample(s); return s; }
function emptyState() { const s = baseState(); delete s._ids; s.players = []; return s; }

/* ---------- Pesquisa ---------- */
const playerById = (id) => S.players.find((p) => p.id === id);
const tourById = (id) => S.tournaments.find((t) => t.id === id);
const lineById = (id) => S.lines.find((l) => l.id === id);
const fundById = (id) => S.funds.find((f) => f.id === id);
const accById = (id) => S.accounts.find((a) => a.id === id);
const catById = (id) => S.cats.find((c) => c.id === id);
const storeById = (id) => S.stores.find((s) => s.id === id);
const typeById = (id) => S.types.find((t) => t.id === id);
const pn = (id) => (String(id || '').startsWith('acc:') ? accById(id.slice(4))?.name || 'Conta da org' : playerById(id)?.name || '—');
const organizers = () => S.players.filter((p) => p.org);
const isExample = (tid) => !!tourById(tid)?.example;
const compOf = (t, key) => t?.comps.find((c) => c.key === key);
const entryTotal = (e) => r2(Object.values(e.amt || {}).reduce((s, v) => s + num(v), 0));
const lineFund = (lineId) => lineById(lineId)?.fundId;
const fundAcc = (fundId) => fundById(fundId)?.accountId;

/* Já pagou a mensal deste mês? (marcação manual/Excel ou noutra inscrição) */
function monthlyPaidElsewhere(playerId, month, exceptEntryId) {
  const p = playerById(playerId);
  const own = exceptEntryId ? tourById(S.entries.find((e) => e.id === exceptEntryId)?.tid) : null;
  const wroteByThis = own?.launched?.wrote?.months?.[p?.name];
  if (p?.months?.[month] && !wroteByThis) return { how: 'excel' };
  for (const e of S.entries) {
    if (e.id === exceptEntryId || e.playerId !== playerId) continue;
    const t = tourById(e.tid);
    if (!t || t.example || monthKey(t.date) !== month) continue;
    const has = t.comps.some((c) => c.monthly && e.amt[c.key] != null);
    if (has) return { how: 'app', t };
  }
  return null;
}

function defaultAmounts(t, playerId) {
  const amt = {};
  t.comps.forEach((c) => {
    if (!c.def) return;
    if (c.monthly && !t.example && monthlyPaidElsewhere(playerId, monthKey(t.date))) return;
    amt[c.key] = c.price;
  });
  return amt;
}

/* ---------- Cálculo ----------
   Âmbito: um torneio (tid), 'geral' (movimentos sem torneio) ou 'all' (tudo menos exemplos).
   Por pessoa, "tem" = dinheiro da org que ainda está com ela:
     recebido + recebido de outros − enviado − pago (loja/despesas) − depositado + reembolsado
   Positivo: tem de entregar. Negativo: a org deve-lhe (pôs do bolso). */
function inScope(tid, scope) {
  if (scope === 'all') return !tid || !isExample(tid);
  if (scope === 'geral') return !tid;
  return tid === scope;
}

function compute(scope) {
  const P = {}, line = {}, fundExp = {}, fundExpP = {}, bank = {}, store = {};
  const person = (id) => (P[id] ||= { id, byMethod: {}, recv: 0, cashIn: 0, cashOut: 0, own: 0, held: 0, lines: [], ownFee: 0 });
  const st = (id) => (store[id] ||= { due: 0, recv: 0, paid: 0, debt: 0 });
  const addLine = (id, v) => { line[id] = r2((line[id] || 0) + v); };
  const addBank = (acc, v) => { bank[acc] = r2((bank[acc] || 0) + v); };
  let players = 0, debtN = 0, debtV = 0;
  const byMethod = {}, byComp = {};
  const recvBy = {};

  S.entries.forEach((e) => {
    if (!inScope(e.tid, scope)) return;
    const t = tourById(e.tid);
    if (!t) return;
    players++;
    const tot = entryTotal(e);
    const paid = e.method !== 'debt';
    byMethod[e.method] = r2((byMethod[e.method] || 0) + tot);
    if (!paid) { debtN++; debtV = r2(debtV + tot); }
    Object.entries(e.amt).forEach(([k, v]) => {
      const c = compOf(t, k); if (!c) return;
      v = num(v);
      const bk = c.label;
      byComp[bk] = r2((byComp[bk] || 0) + (paid ? v : 0));
      if (c.kind === 'loja') { const s = st(c.storeId); s.due = r2(s.due + v); if (paid) s.recv = r2(s.recv + v); else s.debt = r2(s.debt + v); }
      else if (paid) addLine(c.lineId, v);
    });
    if (paid) {
      const p = person(e.recv);
      p.byMethod[e.method] = r2((p.byMethod[e.method] || 0) + tot);
      p.recv = r2(p.recv + tot);
      if (e.method === 'num') p.cashIn = r2(p.cashIn + tot);
      if (e.method === 'own') p.ownFee = r2(p.ownFee + tot);
      const rb = (recvBy[e.recv] ||= { n: 0, v: 0, others: [] });
      rb.n++; rb.v = r2(rb.v + tot);
      if (t.organizerId && e.recv !== t.organizerId && e.playerId !== e.recv) rb.others.push(e);
    }
  });

  const moves = S.moves.filter((m) => inScope(m.tid, scope));
  moves.forEach((m) => {
    const amt = r2(m.amount);
    const isAcc = (x) => String(x || '').startsWith('acc:');
    if (m.kind === 'loja') {
      const p = person(m.by);
      p.held -= 0; p.lines.push({ t: `Pagou à ${storeById(m.storeId)?.name || 'loja'}` + (m.own ? ` (${eur(m.own)} do próprio bolso)` : ''), v: -amt });
      p.cashOut = r2(p.cashOut + num(m.cash)); p.own = r2(p.own + num(m.own));
      p._out = r2((p._out || 0) + amt);
      const s = st(m.storeId); s.paid = r2(s.paid + amt);
    } else if (m.kind === 'despesa') {
      const f = catById(m.catId)?.fundId;
      fundExp[f] = r2((fundExp[f] || 0) + amt);
      if (isAcc(m.by)) addBank(m.by.slice(4), -amt);
      else {
        const p = person(m.by);
        p.lines.push({ t: `Pagou despesa: ${m.desc || catById(m.catId)?.name || ''}` + (m.own ? ` (${eur(m.own)} do bolso)` : ''), v: -amt });
        p.cashOut = r2(p.cashOut + num(m.cash)); p.own = r2(p.own + num(m.own));
        p._out = r2((p._out || 0) + amt);
        fundExpP[f] = r2((fundExpP[f] || 0) + amt);
      }
    } else if (m.kind === 'receita') {
      addLine(m.lineId, amt);
      if (isAcc(m.recv)) addBank(m.recv.slice(4), amt);
      else {
        const p = person(m.recv);
        p.lines.push({ t: `Recebeu: ${m.desc || lineById(m.lineId)?.name || 'receita'}`, v: amt });
        p._in = r2((p._in || 0) + amt);
        if (m.method === 'Numerário') p.cashIn = r2(p.cashIn + amt);
      }
    } else if (m.kind === 'envio') {
      const a = person(m.from), b = person(m.to);
      a._out = r2((a._out || 0) + amt); b._in = r2((b._in || 0) + amt);
      a.lines.push({ t: `Enviou a ${pn(m.to)} (${m.method})`, v: -amt });
      b.lines.push({ t: `Recebeu de ${pn(m.from)} (${m.method})`, v: amt });
      if (m.method === 'Numerário') { a.cashOut = r2(a.cashOut + amt); b.cashIn = r2(b.cashIn + amt); }
    } else if (m.kind === 'deposito') {
      const p = person(m.by);
      p._out = r2((p._out || 0) + amt);
      p.lines.push({ t: `Depositou em ${accById(m.accountId)?.name || 'conta'}`, v: -amt });
      if (m.method === 'Numerário') p.cashOut = r2(p.cashOut + amt);
      addBank(m.accountId, amt);
    } else if (m.kind === 'reembolso') {
      const p = person(m.to);
      p._in = r2((p._in || 0) + amt);
      p.lines.push({ t: `Reembolso de ${accById(m.accountId)?.name || 'conta'}`, v: amt });
      addBank(m.accountId, -amt);
    }
  });

  Object.values(P).forEach((p) => {
    const recvLines = Object.entries(p.byMethod).map(([k, v]) => ({ t: k === 'own' ? 'Inscrição própria (sem movimento)' : `Recebeu em ${METHOD[k]}`, v }));
    p.lines = recvLines.concat(p.lines);
    p.held = r2(p.recv + (p._in || 0) - (p._out || 0));
    p.cashLeft = r2(p.cashIn - p.cashOut);
  });

  // Fundos e contas
  const fundInc = {};
  Object.entries(line).forEach(([lid, v]) => { const f = lineFund(lid); fundInc[f] = r2((fundInc[f] || 0) + v); });
  const funds = S.funds.map((f) => ({ id: f.id, inc: fundInc[f.id] || 0, exp: fundExp[f.id] || 0, delta: r2((fundInc[f.id] || 0) - (fundExp[f.id] || 0)) }));
  const accs = S.accounts.map((a) => {
    const fs = funds.filter((x) => fundAcc(x.id) === a.id);
    const excel = r2(fs.reduce((s, x) => s + x.delta, 0));
    const bk = bank[a.id] || 0;
    return { id: a.id, excel, bank: bk, pending: r2(excel - bk) };
  });
  const sumHeld = r2(Object.values(P).reduce((s, p) => s + p.held, 0));
  const sumPending = r2(accs.reduce((s, a) => s + a.pending, 0));
  const storeHeld = r2(Object.values(store).reduce((s, x) => s + x.recv - x.paid, 0));
  return {
    P, line, funds, accs, store, players, debtN, debtV, byMethod, byComp, recvBy,
    total: r2(Object.entries(byMethod).filter(([k]) => k !== 'debt').reduce((s, [, v]) => s + v, 0)),
    sumHeld, sumPending, storeHeld, balanced: Math.abs(sumHeld - sumPending - storeHeld) < EPS,
  };
}

/* O que cada pessoa tem de fazer */
function actionsFor(C, pid) {
  const p = C.P[pid];
  const tr = S.settings.treasurerId;
  if (!p || Math.abs(p.held) < EPS) return [{ cls: 'ok', txt: 'Tudo acertado' }];
  if (p.held < 0) return [{ cls: 'bad', kind: 'refund', amount: -p.held, txt: `A org deve ${eur(-p.held)} a ${pn(pid)}` }];
  const out = [];
  let left = p.held;
  const storeOut = Object.entries(C.store).map(([id, s]) => ({ id, out: r2(s.due - s.paid) })).filter((x) => x.out > EPS);
  storeOut.forEach((s) => {
    if (left < EPS) return;
    const a = r2(Math.min(left, s.out));
    out.push({ cls: 'warn', kind: 'loja', amount: a, storeId: s.id, txt: `Pagar ${eur(a)} à ${storeById(s.id)?.name}` });
    left = r2(left - a);
  });
  if (left < EPS) return out;
  if (pid !== tr && tr) { out.push({ cls: 'warn', kind: 'send', amount: left, txt: `Enviar ${eur(left)} a ${pn(tr)}` }); return out; }
  C.accs.filter((a) => a.pending > EPS).forEach((a) => {
    if (left < EPS) return;
    const v = r2(Math.min(left, a.pending));
    out.push({ cls: 'warn', kind: 'deposit', amount: v, accountId: a.id, txt: `Depositar ${eur(v)} em ${accById(a.id).name}` });
    left = r2(left - v);
  });
  if (left > EPS) out.push({ cls: 'warn', kind: 'deposit', amount: left, accountId: S.accounts[0]?.id, txt: `Depositar ${eur(left)} nas contas da org` });
  return out;
}

function alertsFor(scope) {
  const C = compute(scope);
  const out = [];
  const t = tourById(scope);
  if (!S.settings.treasurerId) out.push({ lvl: 'bad', txt: 'Escolhe quem é o tesoureiro em Mais › Tesoureiro.' });
  if (C.debtN) out.push({ lvl: 'warn', txt: `${C.debtN} jogador(es) em dívida: ${eur(C.debtV)}.` });
  Object.entries(C.store).forEach(([id, s]) => {
    const o = r2(s.due - s.paid);
    if (o > EPS) out.push({ lvl: 'warn', txt: `Falta pagar ${eur(o)} à ${storeById(id)?.name} (devido ${eur(s.due)}${s.debt ? `, dos quais ${eur(s.debt)} de jogadores em dívida` : ''}).` });
    if (o < -EPS) out.push({ lvl: 'bad', txt: `Pagou-se ${eur(-o)} a mais à ${storeById(id)?.name}.` });
  });
  Object.values(C.P).forEach((p) => {
    if (p.cashLeft < -EPS) out.push({ lvl: 'bad', txt: `${pn(p.id)} usou ${eur(-p.cashLeft)} em numerário a mais do que recebeu. Se foi dinheiro dele(a), indica-o em "do próprio bolso".` });
    else if (p.own > EPS && p.cashLeft > EPS) out.push({ lvl: 'warn', txt: `${pn(p.id)} pôs ${eur(p.own)} do próprio bolso mas ainda devia ter ${eur(p.cashLeft)} em numerário da org. Confirma.` });
  });
  if (t) {
    const seen = {};
    S.entries.filter((e) => e.tid === t.id).forEach((e) => {
      if (seen[e.playerId]) out.push({ lvl: 'bad', txt: `${pn(e.playerId)} está duas vezes no check-in.` });
      seen[e.playerId] = 1;
      if (!t.example && t.comps.some((c) => c.monthly && e.amt[c.key] != null)) {
        const pe = monthlyPaidElsewhere(e.playerId, monthKey(t.date), e.id);
        if (pe) out.push({ lvl: 'warn', txt: `${pn(e.playerId)} já tinha pago a mensal de ${monthName(monthKey(t.date))}${pe.how === 'excel' ? ' (marcado no Excel)' : ` (em ${pe.t.name})`}.` });
      }
      if (!playerById(e.recv)?.org) out.push({ lvl: 'bad', txt: `A inscrição de ${pn(e.playerId)} diz que o dinheiro ficou com alguém que não é organizador.` });
    });
    if (t.launched?.by === 'sheet') {
      if (S.sheet && sheetPayload(t.id).summary.length) out.push({ lvl: 'warn', txt: 'Há alterações deste torneio por escrever no Google Sheets. Vê o separador Excel.' });
    } else if (t.launched) {
      const now = excelDeltas(t.id);
      if (JSON.stringify(now) !== JSON.stringify(t.launched.snap)) out.push({ lvl: 'bad', txt: `Este torneio mudou depois de ser lançado no Excel (${fmtDate(t.launched.date)}). Vê o separador Excel para saberes o que corrigir.` });
    }
  }
  if (!C.balanced) out.push({ lvl: 'bad', txt: `As contas não batem: pessoas têm ${eur(C.sumHeld)}, mas fundos e loja esperam ${eur(C.sumPending + C.storeHeld)}.` });
  return out;
}

/* ---------- Excel ---------- */
/* O que um torneio (ou movimento geral) muda no Excel. */
function excelDeltas(tid, moveId, skipNames) {
  const lines = {}, users = {}, extras = {};
  const exp = [];
  const t = tid ? tourById(tid) : null;
  if (t) {
    S.entries.filter((e) => e.tid === tid && e.method !== 'debt' && !(skipNames && skipNames.has(pn(e.playerId)))).forEach((e) => {
      Object.entries(e.amt).forEach(([k, v]) => {
        const c = compOf(t, k); if (!c || c.kind !== 'line') return;
        lines[c.lineId] = r2((lines[c.lineId] || 0) + num(v));
        if (c.monthly) users[e.playerId] = true;
        if (c.extra) extras[e.playerId] = r2((extras[e.playerId] || 0) + num(v));
      });
    });
  }
  S.moves.filter((m) => (moveId ? m.id === moveId : m.tid === tid && tid)).forEach((m) => {
    if (m.kind === 'receita') lines[m.lineId] = r2((lines[m.lineId] || 0) + r2(m.amount));
    if (m.kind === 'despesa') exp.push({ desc: m.desc || catById(m.catId)?.name || 'Despesa', date: fmtDate(m.date), catId: m.catId, note: m.note || '', value: r2(m.amount) });
  });
  return { lines, exp, users: Object.keys(users).sort(), extras, month: t ? monthKey(t.date) : '' };
}

function fundDeltaOf(d) {
  const out = {};
  Object.entries(d.lines).forEach(([l, v]) => { const f = lineFund(l); out[f] = r2((out[f] || 0) + v); });
  d.exp.forEach((x) => { const f = catById(x.catId)?.fundId; out[f] = r2((out[f] || 0) - x.value); });
  return out;
}

/* Valores que o Excel deve ter agora: base + tudo o que já foi marcado como lançado */
function excelCurrent() {
  const live = S.sheet?.budget;
  if (live && live.lines?.length) {
    const lines = {}, funds = {};
    S.lines.forEach((l) => { const hit = live.lines.find((x) => normName(x.name) === normName(l.name)); lines[l.id] = hit ? hit.value : num(l.value); });
    S.funds.forEach((f) => { const v = live.saldos?.['Saldo ' + f.name]; funds[f.id] = typeof v === 'number' ? v : num(f.saldo); });
    return { lines, funds, live: true, corrente: live.saldos?.['Saldo Corrente'] };
  }
  const lines = {}, funds = {};
  S.lines.forEach((l) => { lines[l.id] = num(l.value); });
  S.funds.forEach((f) => { funds[f.id] = num(f.saldo); });
  const apply = (snap) => {
    Object.entries(snap.lines).forEach(([l, v]) => { lines[l] = r2((lines[l] || 0) + v); });
    Object.entries(fundDeltaOf(snap)).forEach(([f, v]) => { funds[f] = r2((funds[f] || 0) + v); });
  };
  S.tournaments.filter((t) => t.launched && !t.example).forEach((t) => apply(t.launched.snap));
  S.moves.filter((m) => !m.tid && m.launched).forEach((m) => apply(m.launched.snap));
  return { lines, funds };
}

/* Plano para preencher o Excel: antes → somar → depois */
function excelPlan(tid, moveId) {
  const item = tid ? tourById(tid) : S.moves.find((m) => m.id === moveId);
  const d = tid ? excelDeltas(tid) : excelDeltas(null, moveId);
  const launched = item?.launched && !item.example;
  const cur = excelCurrent();
  const snap = launched ? item.launched.snap : null;
  const base = (map, key, snapMap) => (launched ? r2((map[key] || 0) - ((snapMap && snapMap[key]) || 0)) : map[key] || 0);
  const lines = S.lines.filter((l) => d.lines[l.id] || (snap && snap.lines[l.id])).map((l) => {
    const before = base(cur.lines, l.id, snap?.lines);
    return { section: l.section, name: l.name, before, delta: d.lines[l.id] || 0, after: r2(before + (d.lines[l.id] || 0)), was: snap ? r2(snap.lines[l.id] || 0) : null, changed: snap ? r2((snap.lines[l.id] || 0)) !== r2(d.lines[l.id] || 0) : false };
  });
  const fd = fundDeltaOf(d);
  const sfd = snap ? fundDeltaOf(snap) : null;
  const funds = S.funds.map((f) => { const before = base(cur.funds, f.id, sfd); return { name: f.name, before, delta: fd[f.id] || 0, after: r2(before + (fd[f.id] || 0)) }; });
  const tot = (k) => r2(funds.reduce((s, f) => s + f[k], 0));
  return {
    lines, funds, corrente: { before: tot('before'), delta: tot('delta'), after: tot('after') },
    exp: d.exp.map((x) => ({ ...x, cat: catById(x.catId)?.name || '' })),
    month: d.month, users: d.users.map(pn), extras: Object.entries(d.extras).map(([p, v]) => ({ name: pn(p), value: v })),
    launched: !!launched, example: !!item?.example,
  };
}

function pendingLaunch() {
  const out = [];
  S.tournaments.filter((t) => !t.example && !t.launched).forEach((t) => {
    const d = excelDeltas(t.id);
    if (Object.keys(d.lines).length || d.exp.length) out.push({ type: 't', id: t.id, name: t.name, date: t.date });
  });
  S.moves.filter((m) => !m.tid && !m.launched && (m.kind === 'receita' || m.kind === 'despesa')).forEach((m) => out.push({ type: 'm', id: m.id, name: m.desc || (m.kind === 'receita' ? 'Receita' : 'Despesa'), date: m.date }));
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

function launch(tid, moveId, on) {
  const item = tid ? tourById(tid) : S.moves.find((m) => m.id === moveId);
  if (!item) return;
  item.launched = on ? { date: todayISO(), snap: tid ? excelDeltas(tid) : excelDeltas(null, moveId) } : null;
}

/* Contas bancárias: Excel vs banco vs dinheiro com pessoas */
function bankView() {
  const C = compute('all');
  const cur = excelCurrent();
  const pendingAll = {};
  S.tournaments.filter((t) => !t.example && !t.launched).forEach((t) => Object.entries(fundDeltaOf(excelDeltas(t.id))).forEach(([f, v]) => { pendingAll[f] = r2((pendingAll[f] || 0) + v); }));
  S.moves.filter((m) => !m.tid && !m.launched).forEach((m) => Object.entries(fundDeltaOf(excelDeltas(null, m.id))).forEach(([f, v]) => { pendingAll[f] = r2((pendingAll[f] || 0) + v); }));
  return S.accounts.map((a) => {
    const fs = S.funds.filter((f) => f.accountId === a.id);
    const excelNow = r2(fs.reduce((s, f) => s + (cur.funds[f.id] || 0), 0));
    const excelFull = r2(excelNow + fs.reduce((s, f) => s + (pendingAll[f.id] || 0), 0));
    const ca = C.accs.find((x) => x.id === a.id) || { bank: 0, pending: 0 };
    const bank = r2(num(a.opening) + ca.bank);
    const transit = ca.pending;
    return { id: a.id, name: a.name, funds: fs.map((f) => f.name), excelNow, excelFull, bank, transit, gap: r2(excelFull - bank - transit) };
  });
}

/* ---------- Relatório Discord ---------- */
function padRow(label, val, w = 30) {
  const v = eurPlain(val);
  const l = label.length > w - v.length - 1 ? label.slice(0, w - v.length - 2) + '…' : label;
  return l + ' '.repeat(Math.max(1, w - l.length - v.length)) + v;
}

function discordReport(tid, withPlayers) {
  const t = tourById(tid);
  const C = compute(tid);
  const L = [];
  const d = t.date.split('-');
  L.push(`**Breakdown ${t.name} (${d[2]}/${d[1]}/${d[0].slice(2)})**`);
  L.push('');
  L.push(`${C.players} pessoas` + (C.debtN ? ` (${C.debtN} em dívida)` : ''));
  L.push('');
  ['mbway', 'num', 'own'].forEach((k) => { if (C.byMethod[k]) L.push(`${k === 'own' ? 'Inscrição própria dos organizadores' : METHOD[k]} - ${eur(C.byMethod[k])}`); });
  L.push(`Total - ${eur(C.total)}`);
  if (C.debtV) L.push(`Em dívida - ${eur(C.debtV)}`);
  L.push('');
  L.push('Recebido por:');
  Object.entries(C.recvBy).forEach(([pid, r]) => {
    const p = C.P[pid];
    const parts = Object.entries(p.byMethod).map(([k, v]) => `${k === 'own' ? 'própria' : METHOD[k]} ${eur(v)}`).join(' + ');
    L.push(`• ${pn(pid)}: ${eur(r.v)} (${parts})`);
    if (r.others.length) L.push(`   pagaram a ${pn(pid)} em vez de ${pn(t.organizerId)}: ${r.others.map((e) => `${pn(e.playerId)} ${eur(entryTotal(e))}`).join(', ')}`);
  });
  L.push('');
  L.push('Dos quais:');
  Object.entries(C.byComp).filter(([, v]) => v).forEach(([k, v]) => L.push(`• ${k} - ${eur(v)}`));
  const ms = S.moves.filter((m) => m.tid === tid);
  if (ms.length) {
    L.push('');
    L.push('Movimentos:');
    ms.forEach((m) => {
      if (m.kind === 'loja') L.push(`• ${pn(m.by)} pagou ${eur(m.amount)} à ${storeById(m.storeId)?.name}` + ((m.cash || m.own) ? ` (${[m.cash ? `${eur(m.cash)} numerário` : '', r2(m.amount - num(m.cash) - num(m.own)) > EPS ? `${eur(m.amount - num(m.cash) - num(m.own))} MBWAY/transferência` : '', m.own ? `${eur(m.own)} do próprio bolso` : ''].filter(Boolean).join(' + ')})` : ''));
      else if (m.kind === 'envio') L.push(`• ${pn(m.from)} enviou ${eur(m.amount)} a ${pn(m.to)} por ${m.method}`);
      else if (m.kind === 'deposito') L.push(`• ${pn(m.by)} depositou ${eur(m.amount)} em ${accById(m.accountId)?.name}`);
      else if (m.kind === 'despesa') L.push(`• Despesa: ${m.desc || catById(m.catId)?.name} ${eur(m.amount)} paga por ${pn(m.by)}` + (m.own ? ` (${eur(m.own)} do próprio bolso)` : ''));
      else if (m.kind === 'receita') L.push(`• Receita: ${m.desc || lineById(m.lineId)?.name} ${eur(m.amount)} com ${pn(m.recv)}`);
      else if (m.kind === 'reembolso') L.push(`• Reembolso de ${eur(m.amount)} a ${pn(m.to)} (${accById(m.accountId)?.name})`);
    });
  }
  L.push('');
  L.push('**Acertos**');
  const pids = Object.keys(C.P);
  if (!pids.length) L.push('• Nada registado.');
  pids.forEach((pid) => L.push(`• ${pn(pid)}: ${actionsFor(C, pid).map((a) => a.cls === 'ok' ? 'tudo acertado ✅' : a.txt.charAt(0).toLowerCase() + a.txt.slice(1)).join('; ')}`));
  if (withPlayers) {
    L.push('');
    L.push('```');
    const short = { loja: 'L', main: t.comps.find((c) => c.key === 'main')?.label.startsWith('Liga') ? 'Lg' : 'Sm', mensal: 'M', extra: '+' };
    S.entries.filter((e) => e.tid === tid).forEach((e) => {
      const name = pn(e.playerId);
      const comps = t.comps.filter((c) => e.amt[c.key] != null).map((c) => short[c.key] || c.label.slice(0, 2)).join(' ');
      const nm = name.length > 18 ? name.slice(0, 17) + '…' : name;
      L.push(`${nm.padEnd(19)}${comps.padEnd(9)}${(METHOD[e.method] === 'Numerário' ? 'Num' : METHOD[e.method] === 'Em dívida' ? 'DÍVIDA' : METHOD[e.method] === 'Próprio' ? 'Próprio' : 'MBWAY').padEnd(8)}${eurPlain(entryTotal(e)).padStart(5)}`);
    });
    L.push('```');
    L.push('L loja · Lg liga · Sm semanal · M mensal · + adicional');
  }
  return L.join('\n');
}

/* ---------- CSV / JSON ---------- */
function csv(rows) {
  const cell = (v) => {
    let s = typeof v === 'number' ? eurPlain(v) : String(v ?? '');
    if (/[;"\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  return '﻿' + rows.map((r) => r.map(cell).join(';')).join('\r\n');
}

function csvCheckin(tid) {
  const t = tourById(tid);
  const rows = [['Jogador', ...t.comps.map((c) => c.label), 'Total', 'Método', 'Recebido por']];
  S.entries.filter((e) => e.tid === tid).forEach((e) => rows.push([pn(e.playerId), ...t.comps.map((c) => (e.amt[c.key] != null ? num(e.amt[c.key]) : '')), entryTotal(e), METHOD[e.method], pn(e.recv)]));
  return csv(rows);
}

function csvExcel(tid, moveId) {
  const p = excelPlan(tid, moveId);
  const rows = [['Folha', 'Tabela', 'Linha / jogador', 'Antes', 'Somar', 'Depois', 'Notas']];
  p.lines.forEach((l) => rows.push(['Budget Geral', l.section, l.name, l.before, l.delta, l.after, '']));
  p.exp.forEach((x) => rows.push(['Budget Geral', 'Despesas', x.desc, '', -x.value, '', `${x.date} · ${x.cat}${x.note ? ' · ' + x.note : ''}`]));
  p.funds.filter((f) => f.delta).forEach((f) => rows.push(['Budget Geral', 'Saldo', f.name, f.before, f.delta, f.after, 'confirmar']));
  p.users.forEach((u) => rows.push(['Users/Estadios', p.month ? monthName(p.month) : '', u, '', '', '', 'marcar ✓']));
  p.extras.forEach((x) => rows.push(['Users/Estadios', 'Contribuição adicional', x.name, '', x.value, '', 'somar']));
  return csv(rows);
}

function exportBundle(tid) {
  if (!tid) return JSON.parse(JSON.stringify(S));
  const t = tourById(tid);
  const entries = S.entries.filter((e) => e.tid === tid);
  const moves = S.moves.filter((m) => m.tid === tid);
  const pids = new Set([t.organizerId]);
  entries.forEach((e) => { pids.add(e.playerId); pids.add(e.recv); });
  moves.forEach((m) => [m.by, m.from, m.to, m.recv].forEach((x) => x && pids.add(x)));
  return { version: 2, kind: 'torneio', players: S.players.filter((p) => pids.has(p.id)).map((p) => ({ id: p.id, name: p.name, org: p.org })), tournaments: [{ ...t, launched: null }], entries, moves };
}

/* Junta dados de outro organizador. Jogadores com o mesmo nome são o mesmo. */
function importData(data, mode) {
  if (!data || !Array.isArray(data.tournaments) || !Array.isArray(data.entries)) throw new Error('O ficheiro não é da Caixa BBPT (versão 2).');
  if (mode === 'replace') {
    const base = emptyState();
    S = { ...base, ...data, settings: { ...base.settings, ...(data.settings || {}) } };
    return { t: data.tournaments.length, e: data.entries.length, m: (data.moves || []).length };
  }
  const norm = (s) => String(s || '').trim().toLowerCase();
  const pmap = {};
  (data.players || []).forEach((p) => {
    const hit = playerById(p.id) || S.players.find((x) => norm(x.name) === norm(p.name));
    if (hit) { pmap[p.id] = hit.id; if (p.org) hit.org = true; } else { S.players.push({ id: p.id, name: p.name, org: !!p.org, months: {} }); pmap[p.id] = p.id; }
  });
  const mp = (id) => (id && !String(id).startsWith('acc:') ? pmap[id] || id : id);
  const upsert = (arr, item) => { const i = arr.findIndex((x) => x.id === item.id); if (i >= 0) arr[i] = item; else arr.push(item); };
  data.tournaments.forEach((t) => {
    const mine = tourById(t.id);
    upsert(S.tournaments, { ...t, organizerId: mp(t.organizerId), launched: mine?.launched || null });
    S.entries = S.entries.filter((e) => e.tid !== t.id);
    S.moves = S.moves.filter((m) => m.tid !== t.id);
  });
  data.entries.forEach((e) => S.entries.push({ ...e, playerId: mp(e.playerId), recv: mp(e.recv) }));
  (data.moves || []).forEach((m) => upsert(S.moves, { ...m, by: mp(m.by), from: mp(m.from), to: mp(m.to), recv: mp(m.recv) }));
  return { t: data.tournaments.length, e: data.entries.length, m: (data.moves || []).length };
}


/* ---------- Ligação ao Google Sheets ---------- */
const normName = (s) => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const weekKey = (label) => normName(String(label).split('(')[0]);

/* Atualiza dados antigos guardados no telemóvel */
function ensureDefaults(st) {
  if (!st.stores.some((x) => x.id === 's_outro')) st.stores.push({ id: 's_outro', name: 'Outro local' });
  if (!st.types.some((x) => x.id === 't_esp')) st.types.push(ESPECIAL());
}
/* Linha própria do evento especial em Income Misc (é criada no Sheets ao escrever) */
function ensureMiscLine(name) {
  const n = String(name || '').trim();
  if (!n) return '';
  const hit = S.lines.find((l) => normName(l.name) === normName(n));
  if (hit) return hit.id;
  const id = 'l_' + normName(n).replace(/[^a-z0-9]+/g, '_');
  S.lines.push({ id, section: 'Income Misc', name: n, fundId: S.funds.find((f) => /estadio/.test(normName(f.name)))?.id || S.funds[0]?.id, value: 0 });
  return id;
}

function migrate(st) {
  if (!st) return st;
  const seedTypes = baseState().types;
  st.types.forEach((t) => {
    const sd = seedTypes.find((x) => x.id === t.id);
    if (!t.sheetTab && sd) t.sheetTab = sd.sheetTab;
    t.comps.forEach((c) => { if (c.extra && c.lineId === 'l_mens') c.lineId = 'l_doa'; });
  });
  st.tournaments.forEach((t) => {
    t.comps.forEach((c) => { if (c.extra && c.lineId === 'l_mens') c.lineId = 'l_doa'; });
    if (!t.sheetTab) t.sheetTab = st.types.find((x) => x.id === t.typeId)?.sheetTab || '';
  });
  if (!('sheet' in st)) st.sheet = null;
  ensureDefaults(st);
  st.version = 3;
  return st;
}

/* Junta o que veio do Sheets: jogadores, meses pagos e saldos */
function mergeSheet(sheet) {
  if (!sheet) return;
  S.sheet = sheet;
  const year = String(sheet.year || todayISO().slice(0, 4));
  const seen = new Set();
  (sheet.players || []).forEach((sp) => {
    let p = S.players.find((x) => normName(x.name) === normName(sp.name));
    if (!p) { p = { id: slugId(sp.name), name: sp.name, org: false, months: {} }; if (playerById(p.id)) p.id = uid('p'); S.players.push(p); }
    p.name = sp.name; p.inSheet = true; p.sheetExtra = sp.extra || 0;
    const months = {};
    Object.keys(p.months || {}).forEach((k) => { if (!k.startsWith(year)) months[k] = p.months[k]; });
    Object.keys(sp.paid || {}).forEach((m) => { months[`${year}-${pad2(m)}`] = true; });
    p.months = months;
    seen.add(p.id);
  });
  S.players.forEach((p) => { if (!seen.has(p.id)) p.inSheet = false; });
  // Linhas de receita e categorias de despesa vêm do Sheets; ids fixos para serem iguais em todos os telemóveis
  const key = (s) => normName(s).replace(/[^a-z0-9]+/g, '_');
  const guessFund = (txt) => {
    const t = normName(txt);
    const byName = S.funds.find((f) => t.includes(normName(f.name)));
    if (byName) return byName.id;
    if (/critical/.test(t)) return S.funds.find((f) => /critical/.test(normName(f.name)))?.id || '';
    if (/estadio|material|doac|contribui/.test(t)) return S.funds.find((f) => /estadio/.test(normName(f.name)))?.id || '';
    return '';
  };
  const live = sheet.budget || {};
  const liveNames = new Set((live.lines || []).map((l) => normName(l.name)));
  (live.lines || []).forEach((l) => {
    const hit = S.lines.find((x) => normName(x.name) === normName(l.name));
    if (hit) { hit.section = l.section; hit.missing = false; return; }
    const fundId = /ligas/i.test(l.section) ? guessFund(l.name) || S.funds[0]?.id : guessFund(l.name) || guessFund('estadios');
    S.lines.push({ id: 'l_' + key(l.name), section: l.section, name: l.name, fundId, value: 0, fromSheet: true });
  });
  S.lines.forEach((l) => { l.missing = !liveNames.has(normName(l.name)); });
  if (Array.isArray(live.cats)) {
    const liveCats = new Set(live.cats.map(normName));
    live.cats.forEach((c) => {
      const hit = S.cats.find((x) => normName(x.name) === normName(c));
      if (hit) { hit.missing = false; return; }
      S.cats.push({ id: 'c_' + key(c), name: c, fundId: /misc$/i.test(normName(c)) && !/fenix/.test(normName(c)) ? '' : guessFund(c), fromSheet: true });
    });
    S.cats.forEach((c) => { c.missing = !liveCats.has(normName(c.name)); });
  }
}

const sheetComp = (tab) => (S.sheet?.comps || []).find((c) => normName(c.tab) === normName(tab));
function suggestWeek(tab) {
  const c = sheetComp(tab);
  if (!c) return '';
  let lastUsed = -1;
  c.weeks.forEach((w, i) => { if (w.players > 0) lastUsed = i; });
  const used = new Set(S.tournaments.filter((t) => !t.example && normName(t.sheetTab) === normName(tab)).map((t) => t.sheetWeek));
  const free = c.weeks.find((w, i) => i > lastUsed && !used.has(w.key));
  return free ? free.key : '';
}

/* Que parte da inscrição corresponde a que coluna do Sheets */
function sheetSlot(c) {
  if (c.kind === 'loja') return 'loja';
  if (c.monthly) return 'month';
  if (c.extra) return 'extra';
  if (c.key === 'main') return 'liga';
  return null;
}

/* O estado que o Sheets deve ter para este torneio */
function desiredSheet(tid) {
  const t = tourById(tid);
  const d = { tab: t.sheetTab, week: t.sheetWeek, ticks: {}, months: {}, extras: {}, despesas: [], lines: {} };
  const noTab = !t.sheetTab;
  S.entries.filter((e) => e.tid === tid && e.method !== 'debt').forEach((e) => {
    const name = pn(e.playerId);
    t.comps.forEach((c) => {
      if (e.amt[c.key] == null) return;
      const slot = sheetSlot(c);
      if (noTab && c.kind === 'line' && slot !== 'month' && slot !== 'extra') {
        const ln = lineById(c.lineId)?.name;
        if (ln) d.lines[ln] = r2((d.lines[ln] || 0) + num(e.amt[c.key]));
        return;
      }
      if (noTab && slot === 'loja') return;
      if (slot === 'loja' || slot === 'liga') { (d.ticks[name] ||= { loja: false, liga: false })[slot] = true; }
      else if (slot === 'month') d.months[name] = true;
      else if (slot === 'extra') d.extras[name] = r2((d.extras[name] || 0) + num(e.amt[c.key]));
    });
  });
  S.moves.filter((m) => m.tid === tid).forEach((m) => {
    if (m.kind === 'despesa') d.despesas.push(m.id);
    if (m.kind === 'receita') d.lines[lineById(m.lineId)?.name] = r2((d.lines[lineById(m.lineId)?.name] || 0) + r2(m.amount));
  });
  return d;
}

/* Pedido para o script: só a diferença entre o que já foi escrito e o que deve estar */
function sheetPayload(tid, moveId) {
  if (moveId) {
    const m = S.moves.find((x) => x.id === moveId);
    const was = m.launched?.wrote || {};
    const req = { despesas: [], lines: [] };
    if (m.kind === 'despesa' && !(was.despesas || []).includes(m.id)) req.despesas.push(despesaRow(m));
    if (m.kind === 'receita') { const name = lineById(m.lineId)?.name; const add = r2(r2(m.amount) - (was.lines?.[name] || 0)); if (add) req.lines.push({ name, add }); }
    const want = { despesas: m.kind === 'despesa' ? [m.id] : [], lines: m.kind === 'receita' ? { [lineById(m.lineId)?.name]: r2(m.amount) } : {} };
    return { req, want, summary: sheetSummary(req), manual: [] };
  }
  const t = tourById(tid);
  const want = desiredSheet(tid);
  const was = t.launched?.wrote || { ticks: {}, months: {}, extras: {}, despesas: [], lines: {} };
  const req = { addPlayers: [], comp: null, month: null, extras: [], despesas: [], lines: [] };
  const manual = [];
  const sameWeek = !t.launched?.wrote || (was.tab === want.tab && was.week === want.week);
  if (!sameWeek) manual.push(`Este torneio já foi escrito em ${was.tab} · ${was.week}. Desmarca essa semana à mão ou volta a pôr a mesma semana.`);
  const names = new Set([...Object.keys(want.ticks), ...(sameWeek ? Object.keys(was.ticks || {}) : [])]);
  const set = [];
  names.forEach((n) => {
    const a = want.ticks[n] || { loja: false, liga: false };
    const b = (sameWeek && was.ticks?.[n]) || { loja: false, liga: false };
    const x = { name: n, loja: a.loja !== b.loja ? a.loja : null, liga: a.liga !== b.liga ? a.liga : null };
    if (x.loja !== null || x.liga !== null) set.push(x);
  });
  if (set.length) {
    if (!want.tab || !want.week) manual.push('Escolhe a aba e a semana do Sheets em Editar torneio.');
    else req.comp = { tab: want.tab, week: want.week, dateLabel: fmtDate(t.date).replace(/\/(\d{2})(\d{2})$/, '/$2'), set };
  }
  const mset = [];
  new Set([...Object.keys(want.months), ...Object.keys(was.months || {})]).forEach((n) => {
    if (!!want.months[n] !== !!was.months?.[n]) mset.push({ name: n, value: !!want.months[n] });
  });
  if (mset.length) req.month = { m: +t.date.slice(5, 7), set: mset };
  new Set([...Object.keys(want.extras), ...Object.keys(was.extras || {})]).forEach((n) => {
    const add = r2((want.extras[n] || 0) - (was.extras?.[n] || 0));
    if (add) req.extras.push({ name: n, add });
  });
  new Set([...Object.keys(want.lines), ...Object.keys(was.lines || {})]).forEach((n) => {
    const add = r2((want.lines[n] || 0) - (was.lines?.[n] || 0));
    if (add) req.lines.push({ name: n, add, section: S.lines.find((l) => normName(l.name) === normName(n))?.section || '' });
  });
  want.despesas.forEach((id) => { if (!(was.despesas || []).includes(id)) req.despesas.push(despesaRow(S.moves.find((m) => m.id === id))); });
  (was.despesas || []).forEach((id) => { if (!want.despesas.includes(id)) manual.push('Uma despesa já escrita no Sheets foi apagada ou mudada na app. Corrige-a à mão na tabela Despesas.'); });
  const playersNeeded = new Set([...Object.keys(want.ticks), ...Object.keys(want.months), ...Object.keys(want.extras)]);
  const inSheet = new Set((S.sheet?.players || []).map((x) => normName(x.name)));
  playersNeeded.forEach((n) => { if (S.sheet && !inSheet.has(normName(n))) req.addPlayers.push(n); });
  return { req, want, summary: sheetSummary(req), manual };
}

function despesaRow(m) {
  return { id: m.id, desc: m.desc || catById(m.catId)?.name || 'Despesa', date: m.date, cat: catById(m.catId)?.name || '', note: m.note || '', value: r2(m.amount) };
}

function sheetSummary(req) {
  const L = [];
  if (req.addPlayers?.length) L.push(`Adicionar à USER LIST: ${req.addPlayers.join(', ')}`);
  if (req.comp) {
    const on = (k) => req.comp.set.filter((x) => x[k] === true).length, off = (k) => req.comp.set.filter((x) => x[k] === false).length;
    L.push(`${req.comp.tab} · ${req.comp.week.replace(/^./, (c) => c.toUpperCase())}: marcar loja ${on('loja')} e liga ${on('liga')}` + (off('loja') + off('liga') ? `, desmarcar ${off('loja') + off('liga')}` : ''));
  }
  if (req.month) {
    const on = req.month.set.filter((x) => x.value).length, off = req.month.set.length - on;
    L.push(`Users/Estadios · ${MONTHS[req.month.m - 1]}: marcar ${on}` + (off ? `, desmarcar ${off}` : ''));
  }
  (req.extras || []).forEach((x) => L.push(`Contribuição adicional de ${x.name}: ${x.add > 0 ? '+' : ''}${eur(x.add)}`));
  (req.lines || []).forEach((x) => { const isNew = S.sheet && !(S.sheet.budget?.lines || []).some((l) => normName(l.name) === normName(x.name)); L.push(`${isNew ? `Criar a linha "${x.name}" em ${x.section || 'Income Misc'} com` : `${x.name}:`} ${x.add > 0 ? '+' : ''}${eur(x.add)}`); });
  (req.despesas || []).forEach((x) => L.push(`Despesa nova: ${x.desc} · ${eur(x.value)}`));
  return L;
}

/* Depois de o script escrever: guarda o que ficou no Sheets */
function markWritten(tid, moveId, want, rep) {
  const item = tid ? tourById(tid) : S.moves.find((m) => m.id === moveId);
  const prev = item.launched?.wrote;
  const notFound = new Set(rep.notFound || []);
  if (notFound.size && want.ticks) { notFound.forEach((n) => { delete want.ticks[n]; delete want.months[n]; delete want.extras[n]; if (prev?.ticks?.[n]) want.ticks[n] = prev.ticks[n]; }); }
  item.launched = { date: todayISO(), snap: tid ? excelDeltas(tid, null, notFound) : excelDeltas(null, moveId), wrote: want, by: 'sheet', pending: [...notFound] };
  if (rep.sheet) mergeSheet(rep.sheet);
}

/* ---------- Registos partilhados ---------- */
function buildRecords() {
  const out = new Map();
  const put = (id, kind, data) => out.set(id, { id, kind, data, json: JSON.stringify(data) });
  const exTours = new Set(S.tournaments.filter((t) => t.example).map((t) => t.id));
  S.tournaments.forEach((t) => { if (!t.example) put(t.id, 'tour', t); });
  S.entries.forEach((e) => { if (!exTours.has(e.tid)) put(e.id, 'entry', e); });
  S.moves.forEach((m) => { if (!exTours.has(m.tid)) put(m.id, 'move', m); });
  S.players.forEach((p) => { if (p.org || p.inSheet === false) put('pl_' + p.id, 'pl', { id: p.id, name: p.name, org: !!p.org }); });

}

function applyRecords(list) {
  list.forEach((r) => {
    const arrName = { tour: 'tournaments', entry: 'entries', move: 'moves' }[r.kind];
    if (arrName) {
      const arr = S[arrName];
      const i = arr.findIndex((x) => x.id === r.id);
      if (r.deleted) { if (i >= 0) arr.splice(i, 1); }
      else if (i >= 0) arr[i] = r.data; else arr.push(r.data);

      if (p) p.org = !!r.data.org; else S.players.push({ id: r.data.id, name: r.data.name, org: !!r.data.org, months: {}, inSheet: false });
    } else if (r.kind === 'cfg' && !r.deleted) {

      ['types', 'stores', 'accounts', 'cats', 'funds', 'lines'].forEach((k) => { if (Array.isArray(c[k])) S[k] = c[k]; });
      ensureDefaults(S);

}

'use strict';

const LINK_KEY = KEY + '-link';
const EMPTY_LINK = () => ({ url: '', key: '', role: '', who: '', organizers: [], file: '', since: 0, base: {}, meta: {}, init: false, lastOk: 0, lastErr: '', sheetAt: 0, meLocal: LINK?.meLocal || '' });

/* Quem está a usar este telemóvel: vem da chave pessoal (ligado) ou de Mais (sem ligação) */

async function api(body) {
  const res = await fetch(LINK.url, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, key: LINK.key }),
  });
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('O link não respondeu como o script da Caixa. Confirma que copiaste o URL que termina em /exec.'); }
  if (!j.ok) throw new Error(j.error || 'O script devolveu um erro.');
  return j;
}

function computePush() {
  const recs = buildRecords();
  const push = [];
  recs.forEach((r) => { const b = LINK.base[r.id]; if (!b || b.j !== r.json) push.push({ id: r.id, kind: r.kind, data: r.data }); });
  Object.keys(LINK.base).forEach((id) => { const b = LINK.base[id]; if (b && b.j !== null && !recs.has(id)) push.push({ id, kind: b.k, deleted: true }); });
  return push;
}
const pendingCount = () => (linked() && LINK.init && LINK.role === 'org' ? computePush().length : 0);

async function syncNow(opts = {}) {
  if (!LINK.url || !LINK.key) return;
  if (SYNC.busy) { SYNC.queued = true; return; }
  SYNC.busy = true; paintSync('busy');
  try {
    const wantSheet = opts.sheet || !LINK.sheetAt || Date.now() - LINK.sheetAt > 60000;
    const push = LINK.init && LINK.role === 'org' ? computePush() : [];
    const res = await api({ action: 'sync', since: LINK.since || 0, push, sheet: wantSheet });
    const firstTime = !LINK.init;
    LINK.role = res.role; LINK.file = res.file; LINK.who = res.who || ''; LINK.organizers = res.organizers || [];
    LINK.meta ||= {};
    const pushed = new Set(push.map((p) => p.id));
    push.forEach((p) => { LINK.base[p.id] = { k: p.kind, j: p.deleted ? null : JSON.stringify(p.data) }; LINK.meta[p.id] = { by: LINK.who, at: res.serverTime || Date.now() }; });
    const local = LINK.init ? buildRecords() : null;
    const incoming = res.records.filter((r) => {
      if (pushed.has(r.id)) return false;
      if (local) { const l = local.get(r.id); const b = LINK.base[r.id]; if (l && b && l.json !== b.j) return false; } // alterado aqui entretanto: fica o nosso
      return true;
    });
    applyRecords(incoming);
    res.records.filter((r) => !pushed.has(r.id)).forEach((r) => { LINK.base[r.id] = { k: r.kind, j: r.deleted ? null : JSON.stringify(r.data) }; LINK.meta[r.id] = { by: r.by, at: r.updatedAt }; });
    LINK.since = res.serverTime || LINK.since;
    if (res.sheet) { mergeSheet(res.sheet); LINK.sheetAt = Date.now(); }
    markOrganizers(LINK.organizers);
    LINK.init = true; LINK.lastOk = Date.now(); LINK.lastErr = '';
    saveLink(); saveLocal();
    if (!document.querySelector('#sheet:not([hidden])')) render(); else paintSync();
    if (firstTime && LINK.role === 'org' && computePush().length) SYNC.queued = true;
  } catch (e) {
    LINK.lastErr = e.message && !/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? e.message : 'Sem ligação. As alterações ficam guardadas e seguem quando houver rede.';
    saveLink(); paintSync();
  } finally {
    SYNC.busy = false;
    if (SYNC.queued) { SYNC.queued = false; setTimeout(() => syncNow(), 300); }
  }
}

function scheduleSync() {
  if (!linked() || LINK.role !== 'org') return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => syncNow(), 1200);
  paintSync();
}

function startPolling() {
  clearInterval(SYNC.poll);
  SYNC.poll = setInterval(() => { if (document.visibilityState === 'visible' && LINK.url) syncNow(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && LINK.url) syncNow(); });
  window.addEventListener('online', () => { if (LINK.url) syncNow(); });
}

function syncLabel() {
  if (!LINK.url) return null;
  if (SYNC.busy) return { cls: 'busy', txt: 'A sincronizar…' };
  if (LINK.lastErr) return { cls: 'bad', txt: LINK.lastErr };
  const n = pendingCount();
  if (n) return { cls: 'warn', txt: `${n} alteração(ões) por enviar` };
  if (!LINK.lastOk) return { cls: 'warn', txt: 'Ainda não sincronizou' };
  const s = Math.round((Date.now() - LINK.lastOk) / 1000);
  return { cls: 'ok', txt: `Google Sheets · ${s < 60 ? 'agora' : `há ${Math.round(s / 60)} min`}${readOnly() ? ' · só leitura' : ''}` };
}
function syncChip() {
  const l = syncLabel();

  return `<button type="button" class="syncchip ${l.cls}" data-act="sync-now" title="${esc(l.txt)}"><span class="dot" aria-hidden="true"></span><span class="t">${esc(l.cls === 'bad' ? 'Sem ligação' : l.txt)}</span></button>`;
}

async function connect(url, key) {
  url = String(url || '').trim(); key = String(key || '').trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) throw new Error('O link tem de ser o da aplicação Web do Apps Script (https://script.google.com/…/exec).');
  if (!key) throw new Error('Escreve a chave.');
  if (!window.__PWA__) throw new Error('Esta pré-visualização não consegue falar com o Google. Liga a partir da app publicada no GitHub Pages.');
  const prev = { ...LINK };
  LINK = { ...EMPTY_LINK(), url, key };
  try {
    const r = await api({ action: 'ping' });
    LINK.role = r.role; LINK.file = r.file; LINK.who = r.who || ''; LINK.organizers = r.organizers || [];

  new Set([...Object.keys(newSnap.lines), ...Object.keys(oldSnap?.lines || {})]).forEach((l) => { dLines[l] = r2((newSnap.lines[l] || 0) - (oldSnap?.lines?.[l] || 0)); });

  Object.entries(dFunds).filter(([, v]) => v).forEach(([f, v]) => { const exp = r2(preLines.funds[f] + v); checks.push({ name: 'Saldo ' + fundById(f)?.name, expected: exp, got: after.funds[f], ok: Math.abs(exp - after.funds[f]) < EPS }); });
  UI.report = { id: tid || moveId, res, checks, at: Date.now() };

async function exportFile(name, content, mime) {
  if (DL) {
    try { await DL.save({ filename: name, data: content }); toast(`${name} guardado`); } catch (e) { if (e?.code !== 'declined') toast('Não foi possível guardar. Usa "Copiar".'); }
    return;
  }
  const blob = new Blob([content], { type: mime });
  const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (touch && navigator.canShare) {
    try {
      const file = new File([blob], name, { type: mime });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch (e) { toast('Não foi possível descarregar. Usa "Copiar".'); }
